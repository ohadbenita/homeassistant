version: 2
updates:
  - package-ecosystem: pip
    directory: /generative-ai
    schedule:
      interval: weekly
    rebase-strategy: auto
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /generative-ai
    schedule:
      interval: weekly
    rebase-strategy: auto
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    rebase-strategy: auto
    open-pull-requests-limit: 5
