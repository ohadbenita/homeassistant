---
name: Dependabot auto-merge

on:  # yamllint disable-line rule:truthy
  workflow_run:
    workflows:
      - Home Assistant CI
    types:
      - completed

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Wait for CI and merge the tested Dependabot commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          pr_list="$(gh pr list --state open --head "$HEAD_BRANCH" \
            --json number,author,baseRefName,headRefOid,isDraft --limit 1)"
          pr_json="$(printf '%s' "$pr_list" | jq -c '
            [.[] | select(
              .baseRefName == "master" and
              (.author.login == "app/dependabot" or .author.login == "dependabot[bot]") and
              .isDraft == false
            )][0] // empty')"

          if [[ -z "$pr_json" ]]; then
            echo "No open Dependabot pull request found for $HEAD_BRANCH."
            exit 0
          fi

          PR_NUMBER="$(printf '%s' "$pr_json" | jq -r '.number')"
          head_sha="$(printf '%s' "$pr_json" | jq -r '.headRefOid')"
          gh pr checks "$PR_NUMBER" --watch --fail-fast

          checked_head_sha="$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid')"
          if [[ "$checked_head_sha" != "$head_sha" ]]; then
            echo "Pull request changed while CI was running; waiting for its new CI run."
            exit 1
          fi

          gh pr merge "$PR_NUMBER" --rebase --match-head-commit "$head_sha"

      - name: Run validation and Home Assistant sync after merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run validate_hass_configuration.yml --ref master
