---
name: Home Assistant CI

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  lint:
    name: Lint configuration files
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tool: [yamllint, jsonlint, markdownlint]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          if [ "${{ matrix.tool }}" == "yamllint" ]; then
            pip install yamllint
          elif [ "${{ matrix.tool }}" == "jsonlint" ]; then
            npm install -g jsonlint
          else
            npm install -g markdownlint-cli
          fi
      - name: Run linter
        run: |
          if [ "${{ matrix.tool }}" == "yamllint" ]; then
            yamllint .
          elif [ "${{ matrix.tool }}" == "jsonlint" ]; then
            find . -name "*.json" -exec jsonlint -q {} \;
          else
            markdownlint **/*.md
          fi

  validate:
    name: Validate HASS configuration
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Pull Home Assistant Docker image
        run: docker pull ghcr.io/home-assistant/home-assistant:stable

      - name: Validate Configuration
        run: |
          docker run --rm -v $PWD:/config \
            ghcr.io/home-assistant/home-assistant:stable \
            python /usr/src/homeassistant/homeassistant/scripts/check_config.py -c /config

  sync:
    name: Request live Home Assistant sync
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    env:
      HA_URL: ${{ secrets.HA_URL }}
      HA_TOKEN: ${{ secrets.HA_TOKEN }}

    steps:
      - name: Check Home Assistant sync configuration
        id: sync_config
        run: |
          if [ -z "$HA_URL" ] || [ -z "$HA_TOKEN" ]; then
            echo "::notice::HA sync secrets are not configured; skipping."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Request and verify live Home Assistant sync
        if: steps.sync_config.outputs.configured == 'true'
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA::7}"

          curl --fail --show-error --silent \
            --request POST \
            --header "Authorization: Bearer $HA_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{}' \
            --max-time 30 \
            "$HA_URL/api/services/shell_command/sync_home_assistant_from_git"

          for _ in $(seq 1 60); do
            status_json="$(curl --fail --show-error --silent \
              "$HA_URL/local/github_sync_status.json?commit=$short_sha")"
            status="$(printf '%s' "$status_json" | jq -r '.status // ""')"
            commit="$(printf '%s' "$status_json" | jq -r '.commit // ""')"

            if [ "$status" = "success" ] && [ "$commit" = "$short_sha" ]; then
              echo "Home Assistant synced $short_sha."
              exit 0
            fi

            echo "Waiting for Home Assistant sync: status=$status commit=$commit"
            sleep 5
          done

          echo "Home Assistant did not report a successful sync to $short_sha."
          exit 1
