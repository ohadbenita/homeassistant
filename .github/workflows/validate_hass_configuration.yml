---
name: Home Assistant CI

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  lint:
    name: Lint configuration files
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tool: [yamllint, jsonlint, markdownlint]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          if [ "${{ matrix.tool }}" == "yamllint" ]; then
            pip install yamllint
          elif [ "${{ matrix.tool }}" == "jsonlint" ]; then
            npm install -g jsonlint
          else
            npm install -g markdownlint-cli
          fi
      - name: Run linter
        run: |
          if [ "${{ matrix.tool }}" == "yamllint" ]; then
            yamllint .
          elif [ "${{ matrix.tool }}" == "jsonlint" ]; then
            find . -name "*.json" -exec jsonlint -q {} \;
          else
            markdownlint **/*.md
          fi

  validate:
    name: Validate HASS configuration
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Pull Home Assistant Docker image
        run: docker pull ghcr.io/home-assistant/home-assistant:stable

      - name: Validate Configuration
        run: |
          docker run --rm -v $PWD:/config \
            ghcr.io/home-assistant/home-assistant:stable \
            python /usr/src/homeassistant/homeassistant/scripts/check_config.py -c /config

  sync:
    name: Request live Home Assistant sync
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    env:
      HA_SYNC_WEBHOOK_URL: ${{ secrets.HA_SYNC_WEBHOOK_URL }}

    steps:
      - name: Check webhook configuration
        id: webhook_config
        run: |
          if [ -z "$HA_SYNC_WEBHOOK_URL" ]; then
            echo "::notice::HA sync webhook secret is not configured; skipping."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Call Home Assistant sync webhook
        if: steps.webhook_config.outputs.configured == 'true'
        run: |
          curl --fail --show-error --silent \
            --request POST \
            --max-time 10 \
            "$HA_SYNC_WEBHOOK_URL"
