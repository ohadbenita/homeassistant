---
rest_command:
  solar_panels_cleanliness_init:
    url: !secret solar_panels_cleanliness_init_url
    method: GET
    timeout: 120

  solar_panels_cleanliness_update:
    url: !secret solar_panels_cleanliness_update_url
    method: GET
    timeout: 120


template:
  - binary_sensor:
      - name: "Should display energy badge"
        unique_id: "energy_should_display_energy_badge"
        delay_off: "01:00:00"
        state: >-
          {{ states('sensor.solaredge_se15k_power') | int(0) > 0 }}

      - name: "Last Three Days of Month"
        state: >
          {% set now_ = now() %}
          {% set next_month = now_.replace(day=28) + timedelta(days=4) %}
          {% set last_day_this_month = (next_month - timedelta(days=next_month.day)).day %}
          {% if now_.day >= (last_day_this_month - 2) %}
            on
          {% else %}
            off
          {% endif %}

      - name: Solar Panels Need Cleaning
        unique_id: solar_panels_need_cleaning
        device_class: problem
        state: >
          {% set score = states('sensor.solar_panel_cleanliness') | float(100) %}
          {% set threshold = states('input_number.solar_panels_cleaning_threshold') | float(65) %}
          {{ score < threshold }}
        attributes:
          cleanliness_score: "{{ states('sensor.solar_panel_cleanliness') }}"
          threshold: "{{ states('input_number.solar_panels_cleaning_threshold') }}"
          assessment: "{{ state_attr('sensor.solar_panel_cleanliness', 'assessment') }}"
          likely_causes: "{{ state_attr('sensor.solar_panel_cleanliness', 'likely_causes') }}"


  - sensor:
      - name: "Solar Monthly Income"
        unit_of_measurement: "ILS"
        state: >
          {{
            (
              (states('sensor.solaredge_energy_this_month') | float(0) * 0.8 * (states('input_number.kwh_sold') | float(0)))
              +
              (states('sensor.solaredge_energy_this_month') | float(0) * 0.2 * (states('input_number.kwh_cost_net') | float(0)))
            ) | round(2)
          }}

      - name: "Solar Monthly Difference %"
        unique_id: solar_monthly_diff_pct
        unit_of_measurement: "%"
        icon: mdi:percent
        state: >
          {% set monthly_sensor = 'sensor.solaredge_energy_this_month' %}   {# EDIT if different #}
          {% set expected_map = {
            1:1013, 2:1176, 3:1645, 4:1896, 5:2204, 6:2262,
            7:2284, 8:2123, 9:1822, 10:1506, 11:1097, 12:926
          } %}
          {% set expected = expected_map[now().month] | float(0) %}
          {% set actual = states(monthly_sensor) | float(0) %}
          {% if expected > 0 %}
            {{ ((actual - expected) / expected * 100) | round(1) }}
          {% else %}
            0
          {% endif %}
        attributes:
          expected_kwh: >
            {% set expected_map = {
              1:1013, 2:1176, 3:1645, 4:1896, 5:2204, 6:2262,
              7:2284, 8:2123, 9:1822, 10:1506, 11:1097, 12:926
            } %}
            {{ expected_map[now().month] | float(0) }}
          actual_kwh: >
            {% set actual = states('sensor.solaredge_energy_this_month') | float(0) %}
            {{ actual | round(2) }}
          nice_month: "{{ now().strftime('%B') }}"

      - name: "Solar Expected MTD kWh"
        unique_id: solar_expected_mtd_kwh
        unit_of_measurement: "kWh"
        state: >
          {% set expected_map = {
            1:1013, 2:1176, 3:1645, 4:1896, 5:2204, 6:2262,
            7:2284, 8:2123, 9:1822, 10:1506, 11:1097, 12:926
          } %}
          {% set month_expected = expected_map[now().month] | float(0) %}

          {% set start = now().replace(day=1, hour=0, minute=0, second=0, microsecond=0) %}
          {% set next_month = (start + timedelta(days=32)).replace(day=1) %}
          {% set seconds_total = (next_month - start).total_seconds() | float(1) %}
          {% set seconds_elapsed = (now() - start).total_seconds() | float(0) %}
          {% set frac = (seconds_elapsed / seconds_total) | float(0) %}

          {{ (month_expected * frac) | round(2) }}
        attributes:
          expected_kwh_month: >
            {% set expected_map = {
              1:1013, 2:1176, 3:1645, 4:1896, 5:2204, 6:2262,
              7:2284, 8:2123, 9:1822, 10:1506, 11:1097, 12:926
            } %}
            {{ expected_map[now().month] | float(0) }}
          month_fraction_elapsed: >
            {% set start = now().replace(day=1, hour=0, minute=0, second=0, microsecond=0) %}
            {% set next_month = (start + timedelta(days=32)).replace(day=1) %}
            {% set total = (next_month - start).total_seconds() | float(1) %}
            {% set elapsed = (now() - start).total_seconds() | float(0) %}
            {{ (elapsed / total * 100) | round(2) }}
          nice_month: "{{ now().strftime('%B') }}"

      - name: "Solar Actual MTD kWh"
        unique_id: solar_actual_mtd_kwh
        unit_of_measurement: "kWh"
        icon: mdi:solar-power
        state: >
          {% set actual = states('sensor.solaredge_energy_this_month') | float(0) %}
          {{ actual | round(2) }}
        attributes:
          nice_month: "{{ now().strftime('%B') }}"

      - name: "Solar Expected Monthly kWh"
        unique_id: solar_expected_monthly_kwh
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total
        state: >
          {{ state_attr('sensor.solar_monthly_difference', 'expected_kwh') | float(0) }}

input_number:
  kwh_cost_gross:
    name: kWh Cost Gross
    initial: 0.64
    min: 0.5
    max: 1
    step: 0.01
    unit_of_measurement: "ILS/kWh"

  kwh_cost_net:
    name: kWh Cost net
    initial: 0.5952
    min: 0.5
    max: 1
    step: 0.01
    unit_of_measurement: "ILS/kWh"

  kwh_sold:
    name: kWh sold net
    initial: 0.48
    min: 0.48
    max: 0.49
    step: 0.01
    unit_of_measurement: "ILS/kWh"

  solar_panels_cleaning_threshold:
    name: Solar panels cleaning threshold
    min: 0
    max: 100
    step: 1
    initial: 65


script:
  solar_panels_cleanliness_refresh_and_alert:
    alias: Solar panels cleanliness refresh and alert
    sequence:
      - action: rest_command.solar_panels_cleanliness_update

      - delay:
          seconds: 15

      - if:
          - condition: state
            entity_id: binary_sensor.solar_panels_need_cleaning
            state: "on"
        then:
          - action: notify.send_message
            data:
              entity_id: notify.telegram_bot_659000495_155103022
              message: >-
                An issue has been identified in the Solar panels system.
                Cleanliness score is {{ states('sensor.solar_panel_cleanliness') }}/100.
                Threshold is {{ states('input_number.solar_panels_cleaning_threshold') }}.
                Assessment: {{ state_attr('sensor.solar_panel_cleanliness', 'assessment') or 'n/a' }}.


automation:
  - alias: "Alert when solar system is inactive"
    id: energy_alert_when_solar_system_is_inactive
    initial_state: true
    trigger:
      - platform: state
        entity_id: sensor.solaredge_se15k_status
        to: unavailable
        for:
          minutes: 30

    action:
      - action: notify.send_message
        data:
          entity_id: notify.telegram_bot_659000495_155103022
          message: >-
            An issue has been identified in the Solar panels system,
            inverter status has been unavailable for 30 minutes.
      - action: notify.mobile_app_ohadbenita
        data:
          title: "Solar inverter unavailable"
          message: "SolarEdge inverter status has been unavailable for 30 minutes."


  - alias: "Solar inverter fault"
    id: energy_alert_when_solar_inverter_reports_fault
    initial_state: true
    trigger:
      - platform: state
        entity_id: binary_sensor.solaredge_se15k_problem
        to: "on"
    action:
      - action: notify.send_message
        data:
          entity_id: notify.telegram_bot_659000495_155103022
          message: >-
            SolarEdge inverter reports a fault and has stopped producing.
      - action: notify.mobile_app_ohadbenita
        data:
          title: "Solar inverter fault"
          message: "SolarEdge inverter reports a fault and has stopped producing."


###############################################################################
# Automation: at sunset on the last day, send UNDER / WITHIN / ABOVE notification
###############################################################################
  - id: solar_month_end_check
    alias: Solar - Month-End Production Check (Sunset)
    mode: single
    trigger:
      - platform: sun
        event: sunset
    condition:
      - condition: template
        value_template: >
          {% set first = now().replace(day=1, hour=0, minute=0, second=0, microsecond=0) %}
          {% set next_month = (first + timedelta(days=32)).replace(day=1) %}
          {% set last_day = (next_month - timedelta(days=1)).day %}
          {{ now().day == last_day }}
    variables:
      diff_sensor: sensor.solar_monthly_difference
      diff_pct: "{{ states(diff_sensor) | float(0) }}"
      expected_kwh: "{{ state_attr(diff_sensor, 'expected_kwh') | float(0) }}"
      actual_kwh: "{{ state_attr(diff_sensor, 'actual_kwh') | float(0) }}"
      nice_month: "{{ state_attr(diff_sensor, 'nice_month') or now().strftime('%B') }}"
      threshold_pct: 5
      lower_bound: "{{ (expected_kwh * (1 - threshold_pct/100)) | float }}"
      upper_bound: "{{ (expected_kwh * (1 + threshold_pct/100)) | float }}"
    action:
      - choose:
          # --- UNDER target (> threshold below expected) ---
          - conditions:
              - condition: template
                value_template: "{{ expected_kwh > 0 and actual_kwh < lower_bound }}"
            sequence:
              - action: notify.send_message
                data:
                  entity_id: notify.telegram_bot_659000495_155103022
                  title: "SolarEdge • {{ nice_month }} UNDER target"
                  message: >
                    Expected: {{ expected_kwh }} kWh | Actual: {{ actual_kwh }} kWh
                    | Shortfall: {{ (expected_kwh - actual_kwh) | round(2) }} kWh ({{ (-diff_pct) | round(1) }}% below)
                    | Threshold: {{ threshold_pct }}%
                    → Actual is more than {{ threshold_pct }}% below expected.
          # --- ABOVE target (> threshold above expected) ---
          - conditions:
              - condition: template
                value_template: "{{ expected_kwh > 0 and actual_kwh > upper_bound }}"
            sequence:
              - action: notify.send_message
                data:
                  entity_id: notify.telegram_bot_659000495_155103022
                  title: "SolarEdge • {{ nice_month }} ABOVE target 🎉"
                  message: >
                    Expected: {{ expected_kwh }} kWh | Actual: {{ actual_kwh }} kWh
                    | Surplus: {{ (actual_kwh - expected_kwh) | round(2) }} kWh ({{ diff_pct | round(1) }}% above)
                    | Threshold: {{ threshold_pct }}%
                    → Great month! Production exceeded expected by more than {{ threshold_pct }}%.
        default:
          # --- WITHIN threshold (± threshold) ---
          - action: notify.send_message
            data:
              entity_id: notify.telegram_bot_659000495_155103022
              title: "SolarEdge • {{ nice_month }} within target"
              message: >
                Expected: {{ expected_kwh }} kWh | Actual: {{ actual_kwh }} kWh
                | Difference: {{ (actual_kwh - expected_kwh) | round(2) }} kWh ({{ diff_pct | round(1) }}%)
                | Threshold: ±{{ threshold_pct }}%
                → Month closed within tolerance.


  - alias: Solar panels cleanliness init on start
    id: solar_panels_cleanliness_init_on_start
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - action: rest_command.solar_panels_cleanliness_init
      - delay:
          seconds: 30
      - action: script.solar_panels_cleanliness_refresh_and_alert


  - alias: Solar panels cleanliness weekly update
    id: solar_panels_cleanliness_weekly_update
    triggers:
      - trigger: time
        at: "09:00:00"
    conditions:
      - condition: time
        weekday:
          - sun
    actions:
      - action: script.solar_panels_cleanliness_refresh_and_alert

utility_meter:
  solaredge_energy_today:
    source: sensor.solaredge_se15k_energy
    cycle: daily
  solaredge_energy_this_month:
    source: sensor.solaredge_se15k_energy
    cycle: monthly
