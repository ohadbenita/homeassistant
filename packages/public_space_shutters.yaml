  - alias: "Living Room Right - Shutter button actions"
    id: living_room_right_shutter_button_actions
    initial_state: true
    mode: queued
    max: 3

    trigger:
      - platform: state
        entity_id: sensor.living_room_right_shutter_button_action

    variables:
      button_action: "{{ trigger.to_state.state if trigger.to_state is not none else '' }}"
      cover_entity: cover.living_room_right_window
      cover_state: "{{ states(cover_entity) }}"
      current_position: "{{ state_attr(cover_entity, 'current_position') | int(0) }}"

    action:
      - choose:
          # Any button 1/2 press while the shutter is moving -> stop
          - conditions:
              - condition: template
                value_template: >
                  {{ button_action in [
                    'button_1_single',
                    'button_2_single',
                    'button_1_double',
                    'button_2_double'
                  ] and cover_state in ['opening', 'closing'] }}
            sequence:
              - action: cover.stop_cover
                target:
                  entity_id: "{{ cover_entity }}"

          # Button 1 single: open fully
          - conditions:
              - condition: template
                value_template: "{{ button_action == 'button_1_single' }}"
            sequence:
              - action: cover.set_cover_position
                target:
                  entity_id: "{{ cover_entity }}"
                data:
                  position: 100

          # Button 2 single: close fully
          - conditions:
              - condition: template
                value_template: "{{ button_action == 'button_2_single' }}"
            sequence:
              - action: cover.set_cover_position
                target:
                  entity_id: "{{ cover_entity }}"
                data:
                  position: 0

          # Button 1 double: +20% (cap at 100)
          - conditions:
              - condition: template
                value_template: "{{ button_action == 'button_1_double' }}"
            sequence:
              - action: cover.set_cover_position
                target:
                  entity_id: "{{ cover_entity }}"
                data:
                  position: >
                    {% set nxt = current_position + 20 %}
                    {{ [nxt, 100] | min }}

          # Button 2 double: -20% (floor at 0)
          - conditions:
              - condition: template
                value_template: "{{ button_action == 'button_2_double' }}"
            sequence:
              - action: cover.set_cover_position
                target:
                  entity_id: "{{ cover_entity }}"
                data:
                  position: >
                    {% set nxt = current_position - 20 %}
                    {{ [nxt, 0] | max }}


