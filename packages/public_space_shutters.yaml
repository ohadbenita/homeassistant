---
automation:
  - alias: 'Open public space shutters in the morning'
    id: public_space_open_shutters_morning
    initial_state: true
    trigger:
      - platform: state
        entity_id: binary_sensor.kids_hallway_01_occupancy
        from: 'off'
        to: 'on'

    condition:
      condition: and
      conditions:
        - condition: template
          value_template: >-
            {{ as_timestamp(now()) - as_timestamp(state_attr('automation.open_public_space_shutters_in_the_morning', 'last_triggered') or today_at('00:00')) | int > 28800 }}
        - condition: time
          after: '06:00:00'
          before: '10:00:00'
        - condition: state
          entity_id: input_boolean.away_mode
          state: 'off'
        - condition: state
          entity_id: binary_sensor.living_room_presence
          state: 'off'
        - condition: template
          value_template: >-
            {{ (as_timestamp(now()) - as_timestamp(states.binary_sensor.living_room_presence.last_changed)) > 600 }}

    action:
      - action: cover.set_cover_position
        data_template:
          entity_id: cover.living_room_right_window
          position: >-
            {{ max(state_attr('cover.living_room_right_window', 'current_position') | int, 70) }}

      - action: cover.set_cover_position
        data_template:
          entity_id: cover.living_room_middle_window
          position: >-
            {{ max(state_attr('cover.living_room_middle_window', 'current_position') | int, 70) }}

      - action: cover.set_cover_position
        data_template:
          entity_id: cover.shelly2pmg3_e4b32313d15c_cover_0
          position: >-
            {{ max(state_attr('cover.shelly2pmg3_e4b32313d15c_cover_0', 'current_position') | int, 70) }}

      - action: cover.set_cover_position
        data_template:
          entity_id: cover.dining_room_main_window
          position: >-
            {{ max(state_attr('cover.dining_room_main_window', 'current_position') | int, 100) }}

      - action: cover.set_cover_position
        data_template:
          entity_id: cover.shelly2pmg3_34cdb0776380_cover_0
          position: >-
            {{ max(state_attr('cover.shelly2pmg3_34cdb0776380_cover_0', 'current_position') | int, 70) }}

      - action: cover.set_cover_position
        data_template:
          entity_id: cover.dining_room_left_window
          position: >-
            {{ max(state_attr('cover.dining_room_left_window', 'current_position') | int, 70) }}

      - action: cover.set_cover_position
        data_template:
          entity_id: cover.kitchen_window
          position: >-
            {{ max(state_attr('cover.kitchen_window', 'current_position') | int, 70) }}


  - alias: 'Close dining room shutters before sunset'
    id: dining_room_shutters_close_before_sunset
    initial_state: true
    trigger:
      - platform: sun
        event: sunset
        offset: "-01:00:00"
        id: offset_trigger
      - platform: sun
        event: sunset
        id: sunset_trigger

    condition:
      - condition: template
        value_template: >-
          {% if trigger.id == "offset_trigger" %}
            {{ is_state('binary_sensor.dst', 'on') }}
          {% elif trigger.id == "sunset_trigger" %}
            {{ is_state('binary_sensor.dst', 'off') and
              (not is_state('climate.living_room_ac_smartair', 'on')
                or states('sensor.openweathermap_feels_like_temperature') | int < 15) }}
          {% else %}
            false
          {% endif %}
      - condition: state
        entity_id: input_boolean.away_mode
        state: 'off'

    variables:
      target_position: 35
      shutter_windows:
        - cover: cover.dining_room_main_window
          sensors:
            - binary_sensor.dining_room_main_window_contact

        - cover: cover.shelly2pmg3_34cdb0776380_cover_0
          sensors:
            - binary_sensor.dining_room_right_window_01_contact
        - cover: cover.dining_room_left_window
          sensors: []

        - cover: cover.kitchen_window
          sensors:
            - binary_sensor.kitchen_window_01_contact

        - cover: cover.shelly2pmg3_e4b32313d15c_cover_0
          sensors:
            - binary_sensor.living_room_left_window_01_contact
            - binary_sensor.living_room_left_window_02_contact

        - cover: cover.living_room_middle_window
          sensors:
            - binary_sensor.living_room_middle_window_01_contact

        - cover: cover.living_room_right_window
          sensors:
            - binary_sensor.living_room_right_window_01_contact
            - binary_sensor.living_room_right_window_02_contact


    action:
      - repeat:
          for_each: "{{ shutter_windows }}"
          sequence:
            - if:
                - condition: template
                  value_template: >-
                    {{ expand(repeat.item.sensors | default([]))
                      | selectattr('state', 'eq', 'on')
                      | list
                      | count == 0 }}
              then:
                - action: cover.set_cover_position
                  target:
                    entity_id: "{{ repeat.item.cover }}"
                  data:
                    position: >-
                      {{ [state_attr(repeat.item.cover, 'current_position') | int(100), target_position] | min }}

      - if:
          - condition: template
            value_template: >-
              {{ shutter_windows
                | map(attribute='sensors')
                | sum(start=[])
                | select('is_state', 'on')
                | list
                | count > 0 }}
        then:
          - action: script.activate_alexa_actionable_notification
            data:
              text: 'Some windows are open. Close shutters anyway?'
              event_id: actionable_notification_close_dining_room_shutters_sunset
              alexa_device: media_player.kitchen_echo


