---
input_boolean:
  school_timetable_override:
    name: School timetable override
    initial: false
    icon: mdi:calendar-clock

template:
  - binary_sensor:
      - name: School timetable display
        unique_id: school_timetable_display
        state: >-
          {% set day = now().weekday() %}
          {% set hour = now().hour %}
          {% set school_days = [0, 1, 2, 3, 4, 6] %}
          {{ is_state('input_boolean.school_timetable_override', 'on')
             or (((day + 1) % 7 in school_days) and 20 <= hour < 23)
             or (day in [0, 1, 2, 3, 4, 6] and 7 <= hour < 8) }}
        attributes:
          display_target: >-
            {{ 'למחר' if 20 <= now().hour < 23 else 'להיום' }}
          display_day: >-
            {% set target = now() + timedelta(days=1 if 20 <= now().hour < 23 else 0) %}
            {{ ['יום שני', 'יום שלישי', 'יום רביעי', 'יום חמישי', 'יום שישי', 'שבת', 'יום ראשון'][target.weekday()] }}
          display_date: >-
            {{ (now() + timedelta(days=1 if 20 <= now().hour < 23 else 0)).strftime('%d/%m') }}
          day_key: >-
            {% set target = now() + timedelta(days=1 if 20 <= now().hour < 23 else 0) %}
            {{ ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'][target.weekday()] }}
          students: >-
            {{ {
              'עדי': {
                'sunday': ['פותחים שבוע', 'עברית', 'חנ״ג — עופרה', 'אנגלית — אתי', 'מדעים', 'מדעים'],
                'monday': ['מתמטיקה — אתי', 'תנ״ך', 'מיומנויות מחשב', 'מתמטיקה — אתי', 'אנגלית — אתי', 'כתיבה'],
                'tuesday': ['עברית', 'עברית', 'מעגלי בחירה', 'מעגלי בחירה', 'מתמטיקה — אתי', 'כישורי חיים'],
                'wednesday': ['לשון', 'לשון', 'גאוגרפיה', 'קוד ורובוטיקה — ים', 'אנגלית — אתי', 'כישורי חיים'],
                'thursday': ['גאוגרפיה', 'זה״ב — אפרת', 'מתמטיקה — אתי', 'מתמטיקה — אתי', 'חנ״ג — עופרה', 'שביל המורשת — מאיר'],
                'friday': ['תרבות ישראלית', 'תנ״ך', 'גאוגרפיה — אתי', 'כישורי חיים', '', ''],
                'saturday': ['', '', '', '', '', '']
              },
              'רועי': {
                'sunday': ['מגמות', 'מגמות', 'אנגלית', 'אנגלית', 'חנ״ג', 'ספרות', 'תנ״ך', 'מתמטיקה', 'מתמטיקה'],
                'monday': ['מדעי המחשב', 'מדעי המחשב', 'מדעי המחשב', 'מדעי המחשב', 'מדעי המחשב', 'פיזיקה', 'פיזיקה', '', ''],
                'tuesday': ['ספרות', 'ספרות', 'מתמטיקה', 'מתמטיקה', 'חנ״ג', 'חינוך', 'ספרות', 'אנגלית', 'אנגלית'],
                'wednesday': ['מתמטיקה', 'מתמטיקה', 'אנגלית', 'לשון', 'לשון', 'לשון', 'לשון', 'תנ״ך', 'תנ״ך'],
                'thursday': ['לשון', 'לשון', 'תנ״ך', 'תנ״ך', 'לשון', 'לשון', 'חינוך פיננסי', 'חינוך תעבורתי', ''],
                'friday': [],
                'saturday': []
              }
            } | to_json }}

automation:
  - alias: Kitchen tablet - School timetable
    id: kitchen_tablet_school_timetable
    initial_state: true
    mode: restart
    trigger:
      - platform: state
        entity_id: binary_sensor.school_timetable_display
        to: 'on'
        id: show
      - platform: state
        entity_id: binary_sensor.school_timetable_display
        from: 'on'
        to: 'off'
        id: hide
      - platform: homeassistant
        event: start
        id: startup
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.school_timetable_display
                state: 'on'
            sequence:
              - action: select.select_option
                target:
                  entity_id: select.kitchen_fire_tablet_dashboard_view
                data:
                  option: kitchen-weather/ambient
              - action: select.select_option
                target:
                  entity_id: select.kitchen_fire_tablet_screensaver_mode
                data:
                  option: Home Assistant Dashboard
          - conditions:
              - condition: trigger
                id: hide
            sequence:
              - action: select.select_option
                target:
                  entity_id: select.kitchen_fire_tablet_dashboard_view
                data:
                  option: kitchen-weather/ambient
              - action: select.select_option
                target:
                  entity_id: select.kitchen_fire_tablet_screensaver_mode
                data:
                  option: Dim
