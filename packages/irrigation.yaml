                        last_ts: "{{ state_attr(plant.last_watered_entity, 'timestamp') | float(0) }}"
                        interval_days: "{{ plant[season] | int }}"
                        days_since: "{{ ((now().timestamp() - last_ts) / 86400) | int }}"

                    - if:
                        - condition: template
                          value_template: "{{ last_ts > 0 and days_since >= interval_days }}"
