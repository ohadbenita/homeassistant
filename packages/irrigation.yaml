    url: !secret backyard_water_leakage_init_url
    method: GET
    timeout: 30

  watering_leakage_analyze:
    url: !secret backyard_water_leakage_url
    method: GET
    timeout: 90


automation:
  - alias: Weekly Irrigation Cycle - trees and bushes
    id: irrigation_simple_weekly_schedule_trees_bushes
    initial_state: true
    trigger:
      - platform: sun
        event: sunrise
        offset: "-1:00:00"

    condition:
      - condition: time
        weekday:
          - mon
          - wed
          - fri
      - condition: state
        entity_id: binary_sensor.irrigation_schedule_enabled
        state: 'on'

    action:
      - if:
        - condition: state  # yamllint disable-line rule:indentation
          entity_id: input_boolean.rain_expected_next_12_hours
          state: 'off'
        then:
          - action: script.irrigation_cycle
            data:
              additional_switches:
                - switch.irrigation_l4
                - switch.irrigation_l5
              irrigation_duration_minutes: 45
        else:
          - condition: state
            entity_id: input_boolean.away_mode
            state: 'off'
          - action: notify.send_message
            data:
              entity_id: notify.telegram_bot_659000495_155103022
              title: "Irrigation"
              message: "[Trees] Irrigation cycle skipped as it's probably going to rain soon"


  - alias: Weekly Irrigation Cycle - flowers and herbs
    id: irrigation_simple_weekly_schedule_flowers_herbs
    initial_state: true
    trigger:
      - platform: sun
        event: sunrise
        offset: "00:00:00"

    condition:
      - condition: state
        entity_id: binary_sensor.irrigation_schedule_enabled
        state: 'on'

    action:
      - if:
        - condition: state  # yamllint disable-line rule:indentation
          entity_id: input_boolean.rain_expected_next_12_hours
          state: 'off'
        then:
          - action: script.irrigation_cycle
            data:
              additional_switches:
                - switch.irrigation_l3
              irrigation_duration_minutes: 7
        else:
          - condition: state
            entity_id: input_boolean.away_mode
            state: 'off'
          - action: notify.send_message
            data:
              entity_id: notify.telegram_bot_659000495_155103022
              title: "Irrigation"
              message: "[Flowers & herbs] Irrigation cycle skipped as it's probably going to rain soon"


  - alias: Irrigation Watchdog
    id: irrigation_watchdog_shutdown
    initial_state: true
    trigger:
      - platform: time_pattern
        minutes: "/30"
        seconds: 0

    condition:
      condition: and
      conditions:
        - condition: state
          entity_id: switch.irrigation_l6
          state: 'on'
          for:
            minutes: 70

    action:
      - action: switch.turn_off
        entity_id: switch.irrigation_l6
      - action: switch.turn_off
        entity_id: group.irrigation_switches
      - action: switch.turn_off
        entity_id: switch.irrigation_l2

      - wait_for_trigger:
          - platform: state
            entity_id: switch.irrigation_l6
            to: 'off'
        timeout:
          minutes: 2
        continue_on_timeout: true

      - action: notify.send_message
        data:
          entity_id: notify.telegram_bot_659000495_155103022
          title: "Irrigation Watchdog"
          message: >-
            {% if wait.completed %}
              Irrigation Watchdog stopped irrigation after it was left on for over 70 minutes.
            {% else %}
              Irrigation Watchdog tried to stop irrigation after it was left on for over 70 minutes, but switch.irrigation_l6 did not confirm off within 2 minutes. Please check the irrigation switches.
            {% endif %}


