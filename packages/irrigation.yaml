                        - action: notify.mobile_app_ohadbenita
                          data:
                            title: "Check plant"
                            message: >
                              {{ plant.name }} may need water.
                              Area: {{ plant.area }}.
                              Location: {{ plant.location }}.
                              Last watered {{ days_since }} days ago.
                              {{ season | title }} interval is {{ interval_days }} days.


  - alias: Terrarium LED - 8 hour daylight cycle
    description: Keeps the terrarium LED on from 09:00 to 17:00 daily.
    mode: single

    triggers:
      - trigger: time
        at: "09:00:00"
      - trigger: time
        at: "19:00:00"

    actions:
      - choose:
          - conditions:
              - condition: template
                value_template: >
                  {{ today_at('09:00:00') <= now() < today_at('19:00:00') }}
            sequence:
              - action: switch.turn_on
                target:
                  entity_id: switch.sonoff_s20_05
        default:
          - action: switch.turn_off
            target:
              entity_id: switch.sonoff_s20_05


  - alias: Toggle Terrarium LED from NFC tag
    id: toggle_terrarium_led_from_nfc_tag
    description: Toggle the Terrarium LED when the configured NFC tag is scanned.
    mode: single
    trigger:
      - platform: tag
        tag_id: 0cdc0e4f-dbc4-4561-8aef-ee9f12fe9936

    action:
      - action: switch.toggle
        entity_id: switch.sonoff_s20_05


  - alias: Init watering leakage analyzer entity
    trigger:
      - platform: homeassistant
        event: start
    action:
      - action: rest_command.watering_leakage_init


  - alias: "Analyze watering leakage when trees and bushes irrigation starts"
    id: watering_leakage_detection_trees_bushes
    initial_state: true
    mode: single

    trigger:
      platform: state
      entity_id:
        - switch.irrigation_l4
        - switch.irrigation_l5
      to: 'on'

    action:
      - delay: '00:02:00'

      - condition: template
        value_template: >-
          {{
            is_state('switch.irrigation_l4', 'on') or
            is_state('switch.irrigation_l5', 'on')
          }}

      - action: rest_command.watering_leakage_analyze


  - alias: "Alert if watering leakage is detected"
    id: watering_leakage_detected_alert
    initial_state: true

    trigger:
      platform: state
      entity_id: binary_sensor.watering_leakage_detected
      to: 'on'

    condition:
      - condition: template
        value_template: >-
          {{
            state_attr('binary_sensor.watering_leakage_detected', 'confidence') | float(0) >= 0.8
          }}

    action:
      - action: camera.snapshot
        data:
          entity_id: camera.backyard_pano_snapshots_clear
          filename: "/config/www/snapshots/backyard_watering_leakage_snapshot.jpg"

      - delay: '00:00:02'

      - action: notify.send_message
        data:
          entity_id: notify.telegram_bot_659000495_155103022
          title: "Alert: Watering leakage detected"
          message: "Possible irrigation leakage detected in the backyard"
          data:
            photo:
              - file: "/config/www/snapshots/backyard_watering_leakage_snapshot.jpg"
                caption: >-
                  [View Live Feed]({{ states('sensor.ha_base_url') }}/api/camera_proxy/camera.backyard_pano_snapshots_clear?token={{ state_attr('camera.backyard_pano_snapshots_clear', 'access_token') }})
                parse_mode: markdown
