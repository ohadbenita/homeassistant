---
climate:
  - platform: smartir
    name: Ella room AC Smartair
    unique_id: ella_room_ac_smartair
    device_code: 1343
    controller_data: remote.ella_room_broadlink_mini
    temperature_sensor: sensor.ella_room_temperature_temperature
    humidity_sensor: sensor.ella_room_temperature_humidity
    # power_sensor: binary_sensor.living_room_ac_active


template:
  - sensor:
      - name: "Ella room temperature rounded"
        unit_of_measurement: "°C"
        state: "{{ states('sensor.ella_room_temperature_temperature') | float(0) | round(0) }}"
        availability: >
          {{ states('sensor.ella_room_temperature_temperature') not in ['unknown', 'unavailable'] }}
        device_class: temperature
        icon: mdi:thermometer

      - name: "Ella room humidity rounded"
        unit_of_measurement: "%"
        state: "{{ states('sensor.ella_room_temperature_humidity') | float(0) | round(0) }}"
        availability: >
          {{ states('sensor.ella_room_temperature_humidity') not in ['unknown', 'unavailable'] }}
        device_class: humidity
        icon: mdi:water-percent

      - name: "Ella room AC temperature difference"
        unit_of_measurement: "°C"
        state: "{{ (states('sensor.ella_room_temperature_temperature') - state_attr('climate.ella_room_ac_smartair', 'temperature')) | abs }}"
        availability: "{{ state_attr('climate.ella_room_ac_smartair', 'temperature') is not none }}"
        device_class: temperature
        icon: mdi:thermometer


  - binary_sensor:
      - name: "Ella room occupancy"
        device_class: occupancy
        state: >-
          {% set s1 = states('binary_sensor.occupancy_sensor_6cc0_occupancy') %}
          {% set s2 = states('binary_sensor.occupancy_sensor_7480_occupancy') %}
          {% if 'unavailable' in [s1, s2] %}
            'unavailable'
          {% elif s1 == 'on' or s2 == 'on' %}
            on
          {% else %}
            off
          {% endif %}


sensor:
  - platform: derivative
    source: sensor.ella_room_ac_temperature_difference
    name: Ella room temp difference change per 10 minutes
    round: 1
    unit_time: min
    time_window: 10


automation:
  - alias: Ella room shutdown AC 1 hour after target temperature has been reached
    id: ella_room_shutdown_ac_target_temp_reached
    initial_state: false
    trigger:
      - platform: numeric_state
        entity_id: sensor.ella_room_temp_difference_change_per_10_minutes
        above: -1
        below: 1
        for:
          hours: 1
      - platform: template
        value_template: >-
          {{
            states('climate.ella_room_ac_smartair') != 'off' and
            (now() - states.climate.ella_room_ac_smartair.last_changed).total_seconds() > 3600
          }}

    condition:
      - condition: template
        value_template: >
          {{
            states('climate.ella_room_ac_smartair') != 'off' and
            (now() - states.climate.ella_room_ac_smartair.last_changed).total_seconds() > 3600
          }}
      - condition: numeric_state
        entity_id: sensor.ella_room_temp_difference_change_per_10_minutes
        above: -1
        below: 1

    action:
      - action: climate.turn_off
        entity_id: climate.ella_room_ac_smartair


  - alias: "Ella Room - Set AC to night mode (summer)"
    id: ella_room_ac_night_automation
    initial_state: false
    trigger:
      - platform: time
        at: "00:30:00"
      - platform: time
        at: "01:30:00"

    condition:
      condition: and
      conditions:
        - condition: template
          value_template: >-
            {{ not (
                is_state_attr('climate.ella_room_ac_smartair', 'temperature', 24) and
                is_state_attr('climate.ella_room_ac_smartair', 'fan_mode', 'low') and
                is_state_attr('climate.ella_room_ac_smartair', 'swing_mode', 'rangefull')
              )
            }}
        - condition: state
          entity_id: climate.ella_room_ac_smartair
          state: 'cool'

    action:
      - action: climate.set_temperature
        data:
          temperature: 24
          entity_id: climate.ella_room_ac_smartair
      - action: climate.set_fan_mode
        data:
          fan_mode: low
          entity_id: climate.ella_room_ac_smartair
      - action: climate.set_swing_mode
        data:
          swing_mode: rangefull
          entity_id: climate.ella_room_ac_smartair


  - alias: "Ella Room - Turn AC off when no one is in the room"
    id: ella_room_no_presence_turn_ac_off
    initial_state: true
    trigger:
      - platform: state
        entity_id: binary_sensor.ella_room_occupancy
        to: 'off'
        for:
          minutes: 15

    condition:
      condition: template
      value_template: >-
        {{ not is_state('climate.ella_room_ac_smartair', 'off') }}

    action:
      - action: climate.turn_off
        data_template:
          entity_id: climate.ella_room_ac_smartair


  - alias: "Ella Room - Turn lights off when no one is in the room"
    id: ella_room_no_presence_turn_lights_off
    initial_state: true
    trigger:
      - platform: state
        entity_id: binary_sensor.ella_room_occupancy
        to: 'off'
        for:
          minutes: 30

    action:
      - action: switch.turn_off
        target:
          entity_id:
            - switch.shelly2pmg3_8cbfea9f54b0_switch_0
            - switch.shelly2pmg3_8cbfea9f54b0_switch_1


  - alias: Ella smoke detection on
    id: ella_smoke_detection_on
    initial_state: true
    trigger:
      - entity_id: binary_sensor.ella_smoke
        platform: state
        from: 'off'
        to: 'on'

    action:
      - action: notify.mobile_app_ohadbenita
        data:
          title: "Hazards"
          message: "Smoke has been detected in Ella's room"
          data:
            push:
              sound:
                name: "US-EN-Morgan-Freeman-Smartthings-Detected-Smoke.wav"
                critical: 1
                volume: 1.0

      - action: notify.mobile_app_rinats_iphone
        data:
          title: "Hazards"
          message: "Smoke has been detected in the Ella's room"
          data:
            push:
              sound:
                name: "US-EN-Morgan-Freeman-Smartthings-Detected-Smoke.wav"
                critical: 1
                volume: 1.0


      - action: notify.send_message
        data:
          entity_id: notify.telegram_bot_659000495_155103022
          message: "Smoke has been detected in Ella's room"

      - action: notify.mobile_app_ohadbenita
        data:
          title: "Hazards"
          message: "Smoke has been detected in the Ella's room, density is {{states('sensor.ella_smoke_density')}}%"


  - alias: Ella smoke detection off
    id: ella_smoke_detection_off
    initial_state: true
    trigger:
      - entity_id: binary_sensor.ella_smoke
        platform: state
        from: 'on'
        to: 'off'
    action:
      - action: notify.send_message
        data:
          entity_id: notify.telegram_bot_659000495_155103022
          message: "Smoke in Ella's room is not detected anymore"

      - action: notify.mobile_app_ohadbenita
        data:
          title: "Hazards"
          message: "Smoke is not detected in Ella's room, density is {{states('sensor.ella_smoke_density')}}%"


  - alias: "Close Ella room covers on sunset"
    id: ella_room_covers_on_sunset
    mode: single
    initial_state: true
    trigger:
      - platform: sun
        event: sunset

    action:
      - choose:
          - conditions:
              - condition: numeric_state
                entity_id: cover.ella_big_shutter
                attribute: current_position
                above: 55
            sequence:
              - service: cover.set_cover_position
                data:
                  entity_id: cover.ella_big_shutter
                  position: 55
      - choose:
          - conditions:
              - condition: numeric_state
                entity_id: cover.ella_room_small_shutter
                attribute: current_position
                above: 45
            sequence:
              - action: cover.set_cover_position
                data:
                  entity_id: cover.ella_room_small_shutter
                  position: 45


  - alias: 'Ella room - Handle IR actions button actions'
    id: ella_room_ir_actions_button_actions
    initial_state: true
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.ella_ir_buttons_action

    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: sensor.ella_ir_buttons_action
                state: 'button_2_hold'
            sequence:
              - action: remote.send_command
                target:
                  entity_id: remote.ella_room_broadlink_mini
                data:
                  device: ella_tv
                  command:
                    - power

          - conditions:
              - condition: state
                entity_id: sensor.ella_ir_buttons_action
                state: 'button_2_single'
            sequence:
              - action: remote.send_command
                target:
                  entity_id: remote.ella_room_broadlink_mini
                data:
                  device: ella_tv
                  command:
                    - volume_up
                    - volume_up

          - conditions:
              - condition: state
                entity_id: sensor.ella_ir_buttons_action
                state: 'button_1_single'
            sequence:
              - action: remote.send_command
                target:
                  entity_id: remote.ella_room_broadlink_mini
                data:
                  device: ella_tv
                  command:
                    - volume_down
                    - volume_down

          - conditions:
              - condition: state
                entity_id: sensor.ella_ir_buttons_action
                state: 'button_4_double'
            sequence:
              - choose:
                  - conditions:
                      - condition: numeric_state
                        entity_id: input_number.daily_expected_max_temperature
                        above: 23
                    sequence:
                      - action: climate.set_hvac_mode
                        target:
                          entity_id: climate.ella_room_ac_smartair
                        data:
                          hvac_mode: 'cool'
                      - action: climate.set_temperature
                        data:
                          entity_id: climate.ella_room_ac_smartair
                          temperature: 18
                default:
                  - action: climate.set_hvac_mode
                    target:
                      entity_id: climate.ella_room_ac_smartair
                    data:
                      hvac_mode: 'heat'
                  - action: climate.set_temperature
                    data:
                      entity_id: climate.ella_room_ac_smartair
                      temperature: 23

          - conditions:
              - condition: state
                entity_id: sensor.ella_ir_buttons_action
                state: 'button_3_double'
            sequence:
              - action: climate.turn_off
                entity_id: climate.ella_room_ac_smartair

          - conditions:
              - condition: state
                entity_id: sensor.ella_ir_buttons_action
                state: 'button_3_hold'
            sequence:
              - action: cover.close_cover
                target:
                  entity_id:
                    - cover.ella_room_small_shutter
                    - cover.ella_big_shutter

          - conditions:
              - condition: state
                entity_id: sensor.ella_ir_buttons_action
                state: 'button_3_release'
            sequence:
              - action: cover.stop_cover
                target:
                  entity_id:
                    - cover.ella_room_small_shutter
                    - cover.ella_big_shutter

          - conditions:
              - condition: state
                entity_id: sensor.ella_ir_buttons_action
                state: 'button_4_hold'
            sequence:
              - action: cover.open_cover
                target:
                  entity_id:
                    - cover.ella_room_small_shutter
                    - cover.ella_big_shutter

          - conditions:
              - condition: state
                entity_id: sensor.ella_ir_buttons_action
                state: 'button_4_release'
            sequence:
              - action: cover.stop_cover
                target:
                  entity_id:
                    - cover.ella_room_small_shutter
                    - cover.ella_big_shutter

          - conditions:
              - condition: state
                entity_id: sensor.ella_ir_buttons_action
                state: 'button_3_single'
            sequence:
              - action: switch.turn_off
                target:
                  entity_id:
                    - switch.shelly2pmg3_8cbfea9f54b0_switch_0
                    - switch.shelly2pmg3_8cbfea9f54b0_switch_1

          - conditions:
              - condition: state
                entity_id: sensor.ella_ir_buttons_action
                state: 'button_4_single'
            sequence:
              - action: switch.turn_on
                target:
                  entity_id:
                    - switch.shelly2pmg3_8cbfea9f54b0_switch_0
                    - switch.shelly2pmg3_8cbfea9f54b0_switch_1
