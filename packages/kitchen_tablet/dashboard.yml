                grid:
                  - grid-template-areas: '"panel" "parcels"'
                  - grid-template-columns: minmax(0, 1fr)
                  - grid-template-rows: auto auto
                custom_fields:
                  panel:
                    - width: 100%
                    - white-space: normal
                    - text-align: right
              custom_fields:
                parcels:
                  card:
                    type: conditional
                    conditions:
                      - condition: or
                        conditions:
                          - condition: state
                            entity: sensor.17track_in_transit
                            state_not: '0'
                          - condition: state
                            entity: sensor.17track_ready_to_be_picked_up
                            state_not: '0'
                    card:
                      type: custom:mushroom-chips-card
                      card_mod:
                        style:
                          .: >
                            ha-card {
                              direction: rtl;
                              padding: 0 clamp(20px, 5vw, 34px) 15px;
                              --chip-height: 36px;
                              --chip-font-size: 15px;
                              --chip-icon-size: 18px;
                              --chip-spacing: 8px;
                              --chip-background: #e3f7ff12;
                              --chip-border-width: 0;
                              --primary-text-color: #f2f7fd;
                            }

                            @media (max-width: 430px) {
                              ha-card { padding-inline: 17px; }
                            }

                            {% if states('sensor.17track_ready_to_be_picked_up')
                            | int(0) > 0 %}

                            .chip-container >
                            mushroom-template-chip:nth-of-type(2) {
                              filter: drop-shadow(0 0 3px #ffd47770);
                              animation: pickup-pulse 3s ease-in-out infinite;
                            }

                            @keyframes pickup-pulse {
                              0%, 100% { filter: drop-shadow(0 0 2px #ffd47755); }
                              50% { filter: drop-shadow(0 0 8px #ffd477b0); }
                            }

                            @media (prefers-reduced-motion: reduce) {
                              .chip-container > mushroom-template-chip:nth-of-type(2) { animation: none; }
                            }

                            {% endif %}
                          mushroom-template-chip $: |
                            ha-state-icon { margin-inline-end: 7px; }
                      chips:
                        - type: template
                          icon: mdi:truck-delivery-outline
                          icon_color: light-blue
                          content: >-
                            חבילות בדרך · {{ states('sensor.17track_in_transit')
                            if has_value('sensor.17track_in_transit') else '—'
                            }}
                          tap_action:
                            action: navigate
                            navigation_path: /kitchen-tablet-managed/parcels
                        - type: template
                          icon: mdi:package-variant-closed
                          icon_color: amber
                          content: >-
                            ממתינות לאיסוף · {{
                            states('sensor.17track_ready_to_be_picked_up') if
                            has_value('sensor.17track_ready_to_be_picked_up')
                            else '—' }}
                          tap_action:
                            action: navigate
                            navigation_path: /kitchen-tablet-managed/parcels
                panel: >-
                  [[[

                  const weather = states['weather.openweathermap'];

                  const feels =
                  Number.parseFloat(states['sensor.openweathermap_feels_like_temperature']?.state);

                  const temperature =
                  Number.parseFloat(weather?.attributes?.temperature);

                  const humidity =
                  Number.parseFloat(weather?.attributes?.humidity);

                  const indoor =
                  Number.parseFloat(states['sensor.living_room_ac_temperature']?.state);

                  const indoorHumidity =
                  Number.parseFloat(states['sensor.living_room_ac_humidity']?.state);

                  const indoorText = Number.isFinite(indoor) ? `<bdi
                  dir="ltr">${Math.trunc(indoor)}°</bdi>` : 'אין נתון כרגע';

                  const indoorHumidityText = Number.isFinite(indoorHumidity) ?
                  `<span>לחות <bdi
                  dir="ltr">${Math.round(indoorHumidity)}%</bdi></span>` : '';

                  const wind =
                  Number.parseFloat(weather?.attributes?.wind_speed);

                  const now = new Date();

                  const timeZone = hass.config.time_zone;

                  const clock = new Intl.DateTimeFormat('he-IL', {timeZone,
                  hour:'2-digit', minute:'2-digit',
                  hourCycle:'h23'}).format(now);

                  const date = new Intl.DateTimeFormat('he-IL', {timeZone,
                  weekday:'long', day:'numeric', month:'long'}).format(now);

                  const dateKey = new Intl.DateTimeFormat('en-CA', {timeZone,
                  year:'numeric', month:'2-digit', day:'2-digit'});

                  const hourLabel = new Intl.DateTimeFormat('he-IL', {timeZone,
                  hour:'2-digit', minute:'2-digit', hourCycle:'h23'});

                  const night = states['sun.sun']?.state === 'below_horizon';

                  const today = dateKey.format(now);

                  const forecast = this._kitchenHourly ??= {hours: [],
                  refreshAt: 0, loading: false};

                  if (now.getTime() >= forecast.refreshAt) {
                    forecast.refreshAt = now.getTime() + 900000;
                    forecast.loading = true;
                    const source = 'weather.openweathermap';
                    hass.callService('weather', 'get_forecasts', {type:'hourly'}, {entity_id:source}, true, true)
                      .then(result => {
                        forecast.hours = result?.response?.[source]?.forecast ?? [];
                        if (!forecast.hours.length) forecast.refreshAt = Date.now() + 60000;
                      })
                      .catch(() => { forecast.refreshAt = Date.now() + 60000; })
                      .finally(() => { forecast.loading = false; this.requestUpdate(); });
                  }

                  const hours = forecast.hours.filter(slot => {
                    const time = new Date(slot.datetime);
                    if (!Number.isFinite(time.getTime()) || time <= now) return false;
                    if (!night) return dateKey.format(time) === today;
                    const clockTime = hourLabel.format(time);
                    if (clock < '06:00') return dateKey.format(time) === today && clockTime < '06:00';
                    return dateKey.format(time) === today || (clockTime < '06:00' && time - now <= 12 * 3600000);
                  });

                  const temperatures = hours.map(slot =>
                  slot.temperature).filter(Number.isFinite).map(Math.round);

                  const low = Math.min(...temperatures);

                  const high = Math.max(...temperatures);

                  const probabilities = hours.map(slot =>
                  slot.precipitation_probability).filter(Number.isFinite);

                  const rainChance = probabilities.length ?
                  Math.round(Math.max(...probabilities)) : null;

                  const rain = rainChance === 0 ? 'לא צפוי גשם' : rainChance ===
                  null ? '' : `עד <bdi dir="ltr">${rainChance}%</bdi> סיכוי
                  לגשם`;

                  const examples = hours.filter(slot =>
                  Number.isFinite(slot.temperature));

                  const selected = examples.length > 4 ? [examples[0],
                  examples[Math.floor((examples.length - 1) / 2)],
                  examples[examples.length - 1]] : examples.slice(0,3);

                  const upcoming = temperatures.length ? `
                    <strong><bdi dir="ltr">${low === high ? `${low}°` : `${low}°–${high}°`}</bdi></strong>
                    ${rain ? `<div class="weather-rain">${rain}</div>` : ''}
                    <div class="weather-upcoming">${selected.map(slot => `<span><time dir="ltr">${hourLabel.format(new Date(slot.datetime))}</time><bdi dir="ltr">${Math.round(slot.temperature)}°</bdi></span>`).join('')}</div>
                  ` : `<div class="weather-rain">${forecast.loading ? 'טוען
                  תחזית…' : 'אין תחזית זמינה לשעות הקרובות'}</div>`;

                  const conditions = {
                    sunny:['שמשי','weather-sunny'], 'clear-night':['לילה בהיר','weather-night'],
                    partlycloudy:['מעונן חלקית','weather-partly-cloudy'], cloudy:['מעונן','weather-cloudy'],
                    fog:['ערפל','weather-fog'], rainy:['גשום','weather-rainy'], pouring:['גשם כבד','weather-pouring'],
                    lightning:['ברקים','weather-lightning'], 'lightning-rainy':['סופות רעמים','weather-lightning-rainy'],
                    windy:['רוחות ערות','weather-windy'], 'windy-variant':['רוחות ועננות','weather-windy-variant'],
                    snowy:['שלג','weather-snowy'], 'snowy-rainy':['גשם ושלג','weather-snowy-rainy'],
                    hail:['ברד','weather-hail'], exceptional:['מזג אוויר חריג','alert-outline']
                  };

                  const [condition, weatherIcon] = conditions[weather?.state] ??
                  ['נתוני מזג האוויר אינם זמינים','weather-cloudy-alert'];

                  const phases = {new_moon:'מולד הירח', waxing_crescent:'סהר
                  מתמלא', first_quarter:'רבע ראשון',
                    waxing_gibbous:'ירח מתמלא', full_moon:'ירח מלא', waning_gibbous:'ירח מתמעט',
                    last_quarter:'רבע אחרון', waning_crescent:'סהר מתמעט'};
                  const phase = states['sensor.moon_phase']?.state;

                  const moon = phases[phase];

                  const phaseIcon = phase === 'new_moon' ? 'new' : phase ===
                  'full_moon' ? 'full' : phase?.replaceAll('_','-');

                  const warnings =
                  states['sensor.ims_active_weather_warnings']?.state;

                  const warningKnown = warnings && !['unknown',
                  'unavailable'].includes(warnings);

                  const warningActive = warningKnown && warnings !== 'clear';

                  const escapeText = str => str.replaceAll('&',
                  '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;');

                  const warningText = warningActive ? escapeText(warnings) :
                  warningKnown ? 'אין אזהרות מזג אוויר בתוקף' : 'מקור האזהרות
                  אינו זמין כרגע';

                  let clothes = 'אין כרגע נתון על הטמפרטורה המורגשת.'; let
                  clothingIcons = [];

                  if (Number.isFinite(feels)) {
                    if (feels < 10) [clothes, clothingIcons] = ['סוודר, מעיל חם ומכנסיים ארוכים.', ["sweater","jacket","pants"]];
                    else if (feels < 16) [clothes, clothingIcons] = ['סוודר, מעיל קל ומכנסיים ארוכים.', ["sweater","jacket","pants"]];
                    else if (feels < 21) [clothes, clothingIcons] = ['חולצה ארוכה ומכנסיים ארוכים. אפשר לקחת ג׳קט דק.', ["longSleeve","pants","jacket"]];
                    else if (feels < 24) [clothes, clothingIcons] = ['חולצה קצרה ומכנסיים ארוכים מבד דק.', ["shirt","pants"]];
                    else [clothes, clothingIcons] = ['חולצה קצרה ומכנסיים קצרים.', ["shirt","shorts"]];
                  }

                  if (states['input_boolean.rain_expected_next_12_hours']?.state
                  === 'on') {
                    clothes += ' כדאי לקחת מטרייה.';
                    clothingIcons.push('umbrella');
                  }

                  const clothingPaths = {
                    shirt: 'M9 4 4 6l-2 5 4 2 2-3v10h8V10l2 3 4-2-2-5-5-2m-6 0a3 3 0 0 0 6 0',
                    sweater: 'M9 4 5 6l-3 12 4 1 3-8v9h6v-9l3 8 4-1-3-12-4-2m-6 0a3 3 0 0 0 6 0M9 17h6',
                    longSleeve: 'M9 4 5 6l-3 12 4 1 3-8v9h6v-9l3 8 4-1-3-12-4-2m-6 0a3 3 0 0 0 6 0',
                    jacket: 'M9 4 5 6l-3 12 4 1 2-8v9h8v-9l2 8 4-1-3-12-4-2H9l3 4 3-4m-3 4v12m-3-6h1m4 0h1',
                    pants: 'M6 3h12l2 18h-6l-2-10-2 10H4L6 3zm0 4h12',
                    shorts: 'M6 5h12l3 13h-7l-2-5-2 5H3L6 5zm0 3h12',
                    umbrella: 'M3 13a9 9 0 0 1 18 0H3zm9 0v6a2 2 0 0 0 4 0M12 2v2',
                  }; const outfitIcons = clothingIcons.map((item) => `<svg
                  viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="1.9" stroke-linecap="round"
                  stroke-linejoin="round" focusable="false"><path
                  d="${clothingPaths[item]}"></path></svg>`).join('');

                  const commuteMinutes =
                  Math.round(Number.parseFloat(states['sensor.waze_home_to_high_tech_village']?.state));
                  const commuteColor = commuteMinutes <= 75 ? 'green' :
                  commuteMinutes <= 100 ? 'yellow' : 'red';

                  const showCommute =
                  states['binary_sensor.workday_sensor']?.state === 'on' &&
                  clock >= '05:30' && clock < '08:30'; const commuteRow =
                  showCommute && Number.isFinite(commuteMinutes) &&
                  commuteMinutes > 0
                    ? `<div class="weather-commute" dir="rtl"><ha-icon icon="mdi:car-outline" aria-hidden="true"></ha-icon><strong>זמן נסיעה לעבודה</strong><bdi class="commute-time ${commuteColor}" dir="ltr">${Math.floor(commuteMinutes / 60)}:${String(commuteMinutes % 60).padStart(2, '0')}</bdi></div>` : '';

                  const details = [];

                  if (Number.isFinite(humidity)) details.push(`<span>לחות <bdi
                  dir="ltr">${Math.round(humidity)}%</bdi></span>`);

                  if (Number.isFinite(wind)) details.push(`<span>רוח <bdi
                  dir="ltr">${Math.round(wind)}</bdi> קמ״ש</span>`);

                  const uv =
                  Math.round(Number.parseFloat(states['sensor.openweathermap_uv_index']?.state));

                  if (states['sun.sun']?.state === 'above_horizon' &&
                  Number.isFinite(uv) && uv >= 0) {
                   const levels = [[2,'נמוך'],[5,'בינוני'],[7,'גבוה'],[10,'גבוה מאוד'],[Infinity,'קיצוני']];
                   const band = levels.findIndex(([limit]) => uv <= limit);
                   const label = levels[band][1];
                   details.push('<span class="weather-uv-rating weather-uv-scale-' + band + '" dir="rtl"><bdi dir="ltr">UV ' + uv + '</bdi> · ' + label + '</span>');
                  }

                  const aqi =
                  Number.parseFloat(states['sensor.outdoor_air_quality_index']?.state);

                  if (Number.isFinite(aqi) && aqi >= 0) {
                   const levels = [[20,'טובה'],[40,'סבירה'],[60,'בינונית'],[80,'ירודה'],[100,'ירודה מאוד'],[Infinity,'ירודה במיוחד']];
                   const band = levels.findIndex(([limit]) => aqi <= limit);
                   const label = levels[band][1];
                   const className = 'weather-air-scale-' + band;
                   details.push('<span class="weather-air-value ' + className + '" dir="rtl" title="Open-Meteo / CAMS">איכות האוויר: <strong class="weather-air-rating">' + label + ' <bdi dir="ltr">(' + Math.round(aqi) + ')</bdi></strong></span>');
                  }

                  if (moon) details.push(`<span><ha-icon
                  icon="mdi:moon-${phaseIcon}"></ha-icon> ${moon}</span>`);

                  const tempText = Number.isFinite(temperature) ?
                  `${Math.round(temperature)}°` : '—';

                  const feelsText = Number.isFinite(feels) ? `<div
                  class="weather-feels">מרגיש כמו <bdi
                  dir="ltr">${Math.round(feels)}°</bdi></div>` : '';

                  return `<div class="weather-frame" dir="rtl" lang="he">
                    <div class="weather-header"><div class="weather-date">${date}</div><time dir="ltr">${clock}</time></div>
                    <div class="weather-current">
                      <div class="weather-primary"><div class="weather-now-label">בחוץ עכשיו</div>
                        <div class="weather-temperature-line"><div class="weather-symbol"><ha-icon class="${weatherIcon}" icon="mdi:${weatherIcon}" aria-hidden="true"></ha-icon><div class="weather-condition">${condition}</div></div><div class="weather-temp" dir="ltr">${tempText}</div></div>
                      </div>
                      <div class="weather-snippet"><div class="weather-snippet-title">${night ? "תחזית ללילה" : "להמשך היום"}</div>${upcoming}</div>
                    </div>
                    <div class="weather-wear"><div class="wear-label" dir="rtl">מה ללבוש <span class="wear-icons" aria-hidden="true">${outfitIcons}</span></div>
                      <div class="wear-text">${clothes}</div>${feelsText}</div>
                    ${commuteRow}
                    <div class="weather-details">${details.join('')}</div>
                    <div class="weather-indoor" dir="rtl"><span class="weather-row-icon"><ha-icon icon="mdi:home-thermometer-outline"></ha-icon></span><strong>בבית</strong>${indoorText}${indoorHumidityText}</div>
                    <div class="weather-alert ${warningActive ? 'active' : ''}" dir="rtl"><span class="weather-row-icon"><ha-icon icon="mdi:${warningActive ? 'alert-outline' : 'shield-outline'}"></ha-icon></span><div><div class="weather-alert-title">אזהרות בישראל · השירות המטאורולוגי</div><div class="weather-alert-message" dir="rtl">${warningText}</div></div></div>
                  </div>`;

                  ]]]
              extra_styles: >
