---
views:
  - title: מטבח
    path: controls
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: יולנדה
            icon: mdi:gesture-tap-button
            badges:
              - type: entity
                entity: sensor.roborock_s8_maxv_ultra_status
                name: יולנדה
                icon: mdi:robot-vacuum
                show_state: true
                state_content:
                  - name
                  - state
                tap_action:
                  action: more-info
            card_mod:
              style: |
                ha-card .container {
                  direction: rtl;
                  padding-inline: 5px;
                  box-shadow: inset 0 -1px color-mix(in srgb, var(--divider-color) 75%, transparent);
                }
                .content ha-icon {
                  color: color-mix(in srgb, var(--primary-text-color) 68%, #328274);
                }
                h2.heading {
                  font-weight: 650;
                }
                hui-entity-heading-badge {
                  display: block;
                  border-radius: 999px;
                  background: var(--secondary-background-color);
                  padding-inline: 5px;
                }
          - type: tile
            entity: automation.tami4_button_send_yulanda_to_clean_the_kitchen
            name: מטבח
            icon: mdi:countertop-outline
            color: teal
            vertical: true
            hide_state: true
            grid_options:
              columns: 4
              rows: 2
            tap_action:
              action: perform-action
              perform_action: automation.trigger
              target:
                entity_id: automation.tami4_button_send_yulanda_to_clean_the_kitchen
              data:
                skip_condition: false
            icon_tap_action:
              action: perform-action
              perform_action: automation.trigger
              target:
                entity_id: automation.tami4_button_send_yulanda_to_clean_the_kitchen
              data:
                skip_condition: false
            card_mod:
              style: |
                :host {
                  --kitchen-accent: #328274;
                }
                ha-card {
                  --ha-card-border-radius: 18px;
                  --ha-card-border-color: color-mix(in srgb, var(--divider-color) 70%, var(--kitchen-accent) 30%);
                  background: color-mix(in srgb, var(--card-background-color, #fff) 94%, var(--kitchen-accent) 6%);
                  box-shadow: 0 2px 6px rgb(16 33 29 / 6%);
                  transition: transform 120ms ease, box-shadow 120ms ease;
                }
                ha-card:active {
                  transform: scale(.98);
                  box-shadow: none;
                }
                ha-tile-container, ha-tile-info {
                  direction: rtl;
                }
                .primary {
                  font-weight: 650;
                }
                @media (prefers-reduced-motion: reduce) {
                  ha-card { transition: none; }
                  ha-card:active { transform: none; }
                }
