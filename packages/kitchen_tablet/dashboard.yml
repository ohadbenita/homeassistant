                  tickformat: '%H:%M'
                  nticks: 5
                  fixedrange: true
                  gridcolor: '#ffffff20'
                  anchor: 'y'
                yaxis:
                  ticksuffix: °
                  nticks: 5
                  fixedrange: true
                  gridcolor: '#ffffff20'
                  zeroline: false
                showlegend: false
                annotations:
                  - x: 1
                    'y': 1.45
                    xref: paper
                    yref: paper
                    xanchor: right
                    yanchor: middle
                    showarrow: false
                    text: תחזית ל־24 השעות הקרובות
                    font:
                      size: 17
                      color: '#f2f7fd'
                  - x: 1
                    'y': 1.28
                    xref: paper
                    yref: paper
                    xanchor: right
                    yanchor: middle
                    showarrow: false
                    text: >-
                      $fn ({ vars }) => '\u202Bהיום · ' + (vars.todaySummary ??
                      'התחזית אינה זמינה כרגע') + '\u202C'
                    font:
                      size: 13
                      color: '#b1ede4'
                  - x: 1
                    'y': 1.11
                    xref: paper
                    yref: paper
                    xanchor: right
                    yanchor: middle
                    showarrow: false
                    text: |-
                      $fn ({ vars }) => {
                        const hours = vars.forecastHours ?? [];
                        if (!hours.length || hours.every(hour => !Number.isFinite(hour.precipitation) && !Number.isFinite(hour.precipitation_probability))) return "תחזית הגשם אינה זמינה";
                        if (hours.every(hour => hour.precipitation === 0 && hour.precipitation_probability === 0)) return "לא צפוי גשם ב־24 השעות הקרובות";
                        return hours.some(hour => Number.isFinite(hour.precipitation)) ? "■  כמות משקעים במ״מ" : "";
                      }
                    font:
                      size: 12
                      color: '#a7d4ff'
                  - x: 0
                    'y': 1.11
                    xref: paper
                    yref: paper
                    xanchor: left
                    yanchor: middle
                    showarrow: false
                    text: >-
                      $fn ({ vars }) => (vars.forecastHours ?? []).some(hour =>
                      hour.precipitation_probability > 0) ? "⋯  סיכוי לגשם
                      באחוזים" : ""
                    font:
                      size: 12
                      color: '#d5b2ff'
                yaxis2:
                  anchor: x
                  overlaying: 'y'
                  fixedrange: true
                  visible: false
                  range: >-
                    $fn ({ vars }) => [0, Math.max(1, ...(vars.forecastHours ??
                    []).map(hour => Number.isFinite(hour.precipitation) ?
                    hour.precipitation * 2 : 0))]
                yaxis3:
                  anchor: x
                  overlaying: 'y'
                  side: right
                  fixedrange: true
                  range:
                    - 0
                    - 120
                  visible: >-
                    $fn ({ vars }) => (vars.forecastHours ?? []).some(hour =>
                    hour.precipitation_probability > 0)
                  tickvals:
                    - 0
                    - 50
                    - 100
                  ticksuffix: '%'
                  tickfont:
                    size: 10
                    color: '#d5b2ff'
                  showgrid: false
                  zeroline: false
                hovermode: x unified
              config:
                displayModeBar: false
                scrollZoom: false
              card_mod:
                style: |-
                  ha-card {
                    background: #193447;
                    border: 0;
                    box-shadow: none;
                    border-radius: 24px;
                    margin: 0;
                    max-width: 620px;
                    width: 100%;
                  }
    subview: true
    back_path: /kitchen-tablet-managed/controls
  - title: חבילות
    path: parcels
    subview: true
    back_path: /kitchen-tablet-managed/ambient
    type: sections
    max_columns: 1
    sections:
      - type: grid
        cards:
          - type: markdown
            content: |
              <div dir="rtl" lang="he">
              {% if not has_value('sensor.kitchen_tablet_active_parcels') %}
              פרטי החבילות עדיין לא זמינים.
              {% else %}
                {% set parcels = state_attr('sensor.kitchen_tablet_active_parcels', 'packages') or [] %}
                {% if not parcels %}
              אין חבילות בדרך או ממתינות לאיסוף.
                {% else %}
                  {% for parcel in parcels %}
              <p><bdi dir="ltr"><strong>{{ parcel.tracking_number | e }}</strong></bdi> · {{ {'In Transit': 'בדרך', 'Ready to be picked up': 'ממתינה לאיסוף'}.get(parcel.status, parcel.status) | e }}</p>
                  {% endfor %}
                {% endif %}
              {% endif %}
              </div>
          - type: button
            name: חזרה לשומר המסך
            icon: mdi:arrow-right
            tap_action:
              action: navigate
              navigation_path: /kitchen-tablet-managed/ambient
          - type: button
            name: בקרת המטבח
            icon: mdi:tablet-dashboard
            tap_action:
              action: navigate
              navigation_path: /kitchen-tablet-managed/controls
