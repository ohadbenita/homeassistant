            - type: custom:plotly-graph
              hours_to_show: 24
              time_offset: 24h
              refresh_interval: 900
              entities:
                - entity: ''
                  name: טמפרטורה
                  mode: lines+markers
                  line:
                    color: '#69dfcd'
                    width: 3
                    shape: spline
                  marker:
                    size: 4
                  hovertemplate: '%{y:.1f}°C<extra></extra>'
                  filters:
                    - fn: |-
                        async ({ hass, vars }) => {
                         const source = "weather.openweathermap";
                         const request = type => hass.callService("weather", "get_forecasts", { type }, { entity_id: source }, true, true);
                         const [hourly, daily] = await Promise.allSettled([request("hourly"), request("daily")]);
                         const date = new Intl.DateTimeFormat("en-CA", {timeZone:hass.config.time_zone,year:"numeric",month:"2-digit",day:"2-digit"});
                         const now = new Date();
                         const today = daily.value?.response?.[source]?.forecast?.find(day => date.format(new Date(day.datetime)) === date.format(now));
                         const summary = [];
                         if (Number.isFinite(today?.templow)) summary.push("מינ׳ \u2066" + Math.round(today.templow) + "°\u2069");
                         if (Number.isFinite(today?.precipitation_probability)) summary.push("סיכוי לגשם \u2066" + Math.round(today.precipitation_probability) + "%\u2069");
                         vars.todaySummary = summary.length ? summary.join(" · ") : "התחזית היומית אינה זמינה כרגע";
                         const forecast = hourly.value?.response?.[source]?.forecast ?? [];
                         const hours = forecast.filter(hour => Number.isFinite(hour.temperature) && new Date(hour.datetime) >= new Date(now.getTime() - 3600000)).slice(0,24);
                         vars.forecastHours = hours;
                         return { xs: hours.map(hour => new Date(hour.datetime)), ys: hours.map(hour => hour.temperature) };
                        }
                - entity: ''
                  name: כמות משקעים
                  yaxis: y2
                  type: bar
                  width: 2400000
                  marker:
                    color: rgba(110, 182, 255, 0.5)
                  hovertemplate: '%{x|%H:%M} · %{y:.1f} מ״מ<extra>כמות משקעים</extra>'
                  filters:
                    - fn: |-
                        ({ vars }) => {
                          const hours = vars.forecastHours ?? [];
                          const hasRain = hours.some(hour => Number.isFinite(hour.precipitation) && hour.precipitation > 0);
                          return {
                            xs: hours.map(hour => new Date(hour.datetime)),
                            ys: hours.map(hour => hasRain && Number.isFinite(hour.precipitation) ? hour.precipitation : null)
                          };
                        }
                  text: >-
                    $fn ({ vars }) => (vars.forecastHours ?? []).map(hour =>
                    hour.precipitation > 0 ?
                    hour.precipitation.toFixed(1).replace(/\.0$/, "") : "")
                  textposition: outside
                  textfont:
                    color: '#a7d4ff'
                    size: 10
                  cliponaxis: false
                - entity: ''
                  name: סיכוי לגשם
                  yaxis: y3
                  type: scatter
                  mode: lines+markers
                  line:
                    color: '#d5b2ff'
                    width: 2
                    dash: dot
                  marker:
                    size: 3
                  hovertemplate: '%{x|%H:%M} · %{y:.0f}%<extra>סיכוי לגשם</extra>'
                  filters:
                    - fn: |-
                        ({ vars }) => {
                          const hours = vars.forecastHours ?? [];
                          const hasRain = hours.some(hour => Number.isFinite(hour.precipitation_probability) && hour.precipitation_probability > 0);
                          return {
                            xs: hours.map(hour => new Date(hour.datetime)),
                            ys: hours.map(hour => hasRain && Number.isFinite(hour.precipitation_probability) ? hour.precipitation_probability : null)
                          };
                        }
              layout:
                height: 274
                paper_bgcolor: rgba(0,0,0,0)
                plot_bgcolor: rgba(0,0,0,0)
                font:
                  family: system-ui, sans-serif
                  color: '#d6e9f0'
