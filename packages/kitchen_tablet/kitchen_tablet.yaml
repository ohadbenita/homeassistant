---
template:
  - binary_sensor:
      - name: Kitchen tablet freezer door left open
        unique_id: kitchen_tablet_freezer_door_left_open
        device_class: door
        availability: "{{ has_value('binary_sensor.pantry_freezer_01_contact') }}"
        state: "{{ is_state('binary_sensor.pantry_freezer_01_contact', 'on') }}"
        delay_on:
          minutes: 5

  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "0"
      - trigger: state
        entity_id:
          - sensor.17track_in_transit
          - sensor.17track_ready_to_be_picked_up
        to: null
    actions:
      - variables:
          tracking_config_entry: "{{ config_entry_id('sensor.17track_in_transit') }}"
      - condition: template
        value_template: "{{ tracking_config_entry is string }}"
      - action: seventeentrack.get_packages
        data:
          config_entry_id: "{{ tracking_config_entry }}"
          package_state:
            - in_transit
            - ready_to_be_picked_up
        response_variable: tracking
    sensor:
      - name: Kitchen tablet active parcels
        unique_id: kitchen_tablet_active_parcels
        icon: mdi:package-variant-closed
        state: "{{ tracking.packages | count }}"
        attributes:
          packages: "{{ tracking.packages }}"

  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/15"
    actions:
      - action: weather.get_forecasts
        continue_on_error: true
        target:
          entity_id: weather.openweathermap
        data:
          type: hourly
        response_variable: hourly
      - variables:
          forecast: "{{ (hourly | default({}, true)).get('weather.openweathermap', {}).get('forecast', []) }}"
    binary_sensor:
      - name: Kitchen tablet rain forecast next 24 hours
        unique_id: kitchen_tablet_rain_forecast_next_24_hours
        icon: mdi:weather-rainy
        availability: "{{ forecast | count > 0 }}"
        state: >-
          {% set start = as_timestamp(now().replace(minute=0, second=0, microsecond=0)) %}
          {% set end = as_timestamp(now()) + 24 * 60 * 60 %}
          {% set rain = namespace(expected=false) %}
          {% for hour in forecast %}
            {% set timestamp = as_timestamp(hour.get('datetime'), 0) %}
            {% set condition = hour.get('condition') %}
            {% if start <= timestamp < end and (
                condition in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy'] or
                (condition not in ['snowy', 'hail'] and hour.get('precipitation', 0) | float(0) > 0)) %}
              {% set rain.expected = true %}
            {% endif %}
          {% endfor %}
          {{ rain.expected }}

script:
  register_israel_post_parcel:
    alias: Register Israel Post parcel
    mode: queued
    fields:
      tracking_number:
        name: Tracking number
        required: true
        selector:
          text:
    sequence:
      - variables:
          code: "{{ tracking_number | default('') | trim | upper }}"
          track_service: "{{ config_entry_id('sensor.17track_in_transit') }}"
      - condition: template
        value_template: >-
          {{ track_service and code is match('^[A-Z]{2}[0-9]{9}(?:[A-Z][A-Z0-9]|[0-9][A-Z])$') }}
      - action: seventeentrack.get_packages
        data:
          config_entry_id: "{{ track_service }}"
        response_variable: tracked
      - condition: template
        value_template: >-
          {{ code not in (tracked.packages | map(attribute='tracking_number') | map('upper') | list) }}
      - action: seventeentrack.add_package
        data:
          config_entry_id: "{{ track_service }}"
          package_tracking_number: "{{ code }}"
          package_friendly_name: "{{ 'Israel Post ' ~ code }}"
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.17track_in_transit

automation:
  - alias: Kitchen tablet - clean living room
    id: kitchen_tablet_clean_living_room
    trigger: []
    condition:
      - condition: state
        entity_id: input_boolean.away_mode
        state: 'off'
    action:
      - action: vacuum.send_command
        target:
          entity_id: vacuum.yulanda
        data:
          command: app_segment_clean
          params:
            - segments:
                - 25
              repeat: 2
      - action: script.alexa_notification
        data:
          alexa_device: media_player.kitchen_echo
          volume: 0.4
          message: I just sent Yulanda to clean the living room

