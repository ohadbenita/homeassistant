  - alias: Kitchen tablet - Lock screensaver in Away mode
    id: kitchen_tablet_lock_screensaver_in_away_mode
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_boolean.away_mode
        to:
          - 'on'
          - 'off'
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: switch.kitchen_fire_tablet_lockdown_mode
        from:
          - unavailable
          - unknown
        to:
          - 'on'
          - 'off'
    conditions:
      - condition: state
        entity_id: input_boolean.away_mode
        state:
          - 'on'
          - 'off'
    actions:
      - if:
          - condition: state
            entity_id: input_boolean.away_mode
            state: 'on'
        then:
          - action: switch.turn_on
            target:
              entity_id: switch.kitchen_fire_tablet_lockdown_mode
          - action: switch.turn_on
            target:
              entity_id: switch.kitchen_fire_tablet_screensaver_active
        else:
          - action: switch.turn_off
            target:
              entity_id: switch.kitchen_fire_tablet_lockdown_mode

  - alias: Kitchen tablet - Show doorbell live preview
    id: kitchen_tablet_show_doorbell_live_preview
    mode: queued
    triggers:
      - trigger: state
        id: ring
        entity_id: event.front_door_ding
        not_to:
          - unknown
          - unavailable
      - trigger: state
        id: alexa
        entity_id: input_boolean.ring_doorbell_preview
        to: 'on'
    actions:
      - if:
          - condition: trigger
            id: alexa
        then:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.ring_doorbell_preview
      - condition: state
        entity_id: input_boolean.away_mode
        state: 'off'
      - condition: time
        after: "06:00:00"
      - condition: template
        value_template: >-
          {{ trigger is not defined
             or trigger.id != 'ring'
             or (trigger.to_state.attributes.event_type == 'ring'
                 and 0 <= as_timestamp(now()) - as_timestamp(trigger.to_state.state, 0) < 30) }}
      - condition: not
        conditions:
          - condition: state
            entity_id: sensor.kitchen_kitchen_fire_tablet_active_camera_view
            state: Doorbell
      - parallel:
          - action: esphome.ks_kitchen_fire_tablet_notification
            data:
              message: צלצול בדלת הכניסה
              title: ""
              duration: 30
              type: info
              chime: false
              scale: 1.4
              icon: mdi:doorbell-video
              chime_file: ""
              volume: 0
              image: /api/camera_proxy/camera.main_entrance_fluent
          - action: button.press
            target:
              entity_id: button.kitchen_kitchen_fire_tablet_show_doorbell

  - alias: Kitchen tablet - Dim weather screensaver when kitchen is empty
    id: kitchen_tablet_dim_weather_when_empty
    mode: restart
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.presence_sensor_fp2_69e2_presence_sensor_1
          - input_boolean.away_mode
        to:
          - 'on'
          - 'off'
          - unknown
          - unavailable
      - trigger: state
        entity_id: switch.kitchen_fire_tablet_screensaver_brightness
        from:
          - unknown
          - unavailable
        to:
          - 'on'
          - 'off'
      - trigger: homeassistant
        event: start
    actions:
      - variables:
          dim: >-
            {{ not (is_state('binary_sensor.presence_sensor_fp2_69e2_presence_sensor_1', 'on')
                    and is_state('input_boolean.away_mode', 'off')) }}
      - condition: template
        value_template: >-
          {{ is_state('switch.kitchen_fire_tablet_screensaver_brightness',
                      'off' if dim else 'on') }}
      - action: "switch.{{ 'turn_on' if dim else 'turn_off' }}"
        target:
          entity_id: switch.kitchen_fire_tablet_screensaver_brightness
