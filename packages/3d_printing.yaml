---
input_datetime:
  print_active_start_time:
    name: Print Active Start Time
    has_date: true
    has_time: true

input_number:
  printer_filament_grams_per_meter:
    name: Printer Filament Grams per Meter
    min: 0.1
    max: 10
    step: 0.01
    initial: 3.05
    unit_of_measurement: g/m
    mode: box


sensor:
  - platform: history_stats
    name: "3D Print Active Time"
    entity_id: sensor.creality_ender_v3_ke_current_print_state
    state: "printing"
    type: time
    min_state_duration: "00:00:00"
    start: "{{ as_datetime(states('input_datetime.print_active_start_time')) if states('input_datetime.print_active_start_time') not in ['unknown', 'unavailable', ''] else now() }}"
    end: "{{ now() }}"


command_line:
  - sensor:
      name: 3D print latest timelapse filename
      command: python3 /config/scripts/latest_timelapse_filename.py
      scan_interval: 300


shell_command:
  download_latest_mp4_timelapse: '/config/scripts/download_latest_timelapse.sh'


script:
  reload_moonraker:
    alias: Reload Moonraker
    sequence:
      - action: homeassistant.reload_config_entry
        data:
          entry_id: 01KAGP6872VWEN5BW0ZS6BZAHE


template:
  - sensor:
      - name: "3D Print Estimated Completion Time"
        unit_of_measurement: "hours"
        state: >
          {% set current_progress = states('sensor.creality_ender_v3_ke_progress') | float(0) %}
          {% set active_time = states('sensor.3d_print_active_time') | float(0) %}

          {% if current_progress > 0 and active_time > 0 %}
            {{ ((100 - current_progress) * active_time / current_progress) | round(2) }}
          {% else %}
            0
          {% endif %}
      # Estimate only: nozzle temperature ranges overlap between filament types.
      - name: "3D Printer Filament Estimate"
        unique_id: 3d_printer_filament_estimate
        icon: mdi:printer-3d-nozzle
        state: >
          {% set target_state = states('number.creality_ender_v3_ke_extruder_target') %}
          {% set target = target_state | float(none) %}
          {% if target is none %}
            Unknown (no nozzle target)
          {% elif target < 210 %}
            PLA likely
          {% elif target < 220 %}
            PLA / TPU range
          {% elif target < 230 %}
            PLA / TPU / ABS overlap
          {% elif target <= 250 %}
            PETG likely (overlapping ranges)
          {% elif target <= 260 %}
            ABS / ASA likely
          {% else %}
            High-temperature filament likely
          {% endif %}
        attributes:
          nozzle_target: "{{ states('number.creality_ender_v3_ke_extruder_target') }} °C"
          estimate_note: "Guessed from nozzle target only; check the slicer or filament label to confirm."
      # Default is about 3.05 g/m for 1.75 mm PETG; adjust the YAML helper for other filament.
      - name: "3D Print Estimated Filament Weight Used"
        unique_id: 3d_print_estimated_filament_weight_used
        icon: mdi:weight-gram
        device_class: weight
        state_class: measurement
        unit_of_measurement: g
        attributes:
          grams_per_meter: "{{ states('input_number.printer_filament_grams_per_meter') }}"
          estimate_note: "Estimated from filament length and configured grams per meter."
        state: >
          {% set length = states('sensor.creality_ender_v3_ke_filament_used') | float(none) %}
          {% set grams_per_meter = states('input_number.printer_filament_grams_per_meter') | float(none) %}
          {% if length is not none and grams_per_meter is not none %}
            {{ (length * grams_per_meter) | round(1) }}
          {% else %}
            unknown
          {% endif %}
      - name: "3D Print Projected Total Filament Weight"
        unique_id: 3d_print_projected_total_filament_weight
        icon: mdi:weight
        device_class: weight
        state_class: measurement
        unit_of_measurement: g
        attributes:
          estimate_note: "Projected from current filament use and print progress; actual use can vary."
        state: >
          {% set used_weight = states('sensor.3d_print_estimated_filament_weight_used') | float(none) %}
          {% set progress = states('sensor.creality_ender_v3_ke_progress') | float(none) %}
          {% if used_weight is not none and progress is not none and progress > 0 %}
            {{ (used_weight * 100 / progress) | round(1) }}
          {% else %}
            unknown
          {% endif %}

automation:
  - alias: "Initialize Print Active Start Time on Startup"
    id: 3d_printer_initialize_print_active_start_time
    initial_state: false
    trigger:
      - platform: homeassistant
        event: start
    action:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.print_active_start_time
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

  - alias: "Reset 3D Print Active Time When Printing Starts"
    id: 3d_printer_reset_print_active_time_when_printing_starts
    initial_state: true
    trigger:
      - platform: state
        entity_id: sensor.creality_ender_v3_ke_current_print_state
        to: printing
    action:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.print_active_start_time
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"


  - alias: "Send print details and final picture when printing is done"
    id: 3d_printer_send_snapshot_when_done
    initial_state: true
    trigger:
      - platform: state
        entity_id: sensor.creality_ender_v3_ke_current_print_state
        from: printing
        to: complete

    action:
      - action: notify.send_message
        data:
          entity_id: notify.telegram_bot_659000495_155103022
          message: >-
            3D print complete: {{ states('sensor.creality_ender_v3_ke_filename') }}.
            Material estimate: {{ states('sensor.3d_printer_filament_estimate') }}.
            Print duration: {{ (states('sensor.creality_ender_v3_ke_print_duration') | float(0) / 60) | round(1) }} hours.
            Filament used: {{ states('sensor.creality_ender_v3_ke_filament_used') | float(0) | round(1) }} m
            (about {{ states('sensor.3d_print_estimated_filament_weight_used') }} g at
            {{ states('input_number.printer_filament_grams_per_meter') }} g/m).
            Estimated total filament: {{ states('sensor.3d_print_projected_total_filament_weight') }} g.
            Nozzle: {{ states('sensor.creality_ender_v3_ke_extruder_temperature') }}°C
            (target {{ states('number.creality_ender_v3_ke_extruder_target') }}°C).
            Bed: {{ states('sensor.creality_ender_v3_ke_bed_temperature') }}°C
            (target {{ states('number.creality_ender_v3_ke_bed_target') }}°C).

      - action: camera.snapshot
        continue_on_error: true
        data:
          entity_id: camera.study_rpi3b_creality_nebula
          filename: "/config/www/snapshots/3d_printer_snapshot.jpg"

      - delay: '00:00:02'

      - action: telegram_bot.send_photo
        continue_on_error: true
        data:
          chat_id: !secret telegram_homeassistant_notifications_chat_id
          file: "/config/www/snapshots/3d_printer_snapshot.jpg"
          caption: "Print complete: {{ states('sensor.creality_ender_v3_ke_filename') }}"

  - alias: "Send picture once printing is in error"
    id: 3d_printer_send_snapshot_when_in_error
    initial_state: true
    trigger:
      - platform: state
        entity_id: sensor.creality_ender_v3_ke_current_print_state
        to:
          - error
          - paused

    action:
      - action: camera.snapshot
        data:
          entity_id: camera.creality_ender_v3_ke
          filename: "/config/www/snapshots/3d_printer_snapshot_error.jpg"
      - delay: '00:00:02'

      - action: notify.send_message
        data:
          entity_id: notify.telegram_bot_659000495_155103022
          message: >-
            The 3D print {{ states('sensor.creality_ender_v3_ke_current_print_state') }}.
            Error: {{ states('sensor.creality_ender_v3_ke_current_print_message')
              if states('sensor.creality_ender_v3_ke_current_print_message') not in ['', 'unknown', 'unavailable']
              else states('sensor.creality_ender_v3_ke_printer_message') }}.
            Nozzle: {{ states('sensor.creality_ender_v3_ke_extruder_temperature') }}°C
            (target {{ states('number.creality_ender_v3_ke_extruder_target') }}°C).
            Bed: {{ states('sensor.creality_ender_v3_ke_bed_temperature') }}°C
            (target {{ states('number.creality_ender_v3_ke_bed_target') }}°C).
            Progress: {{ states('sensor.creality_ender_v3_ke_progress') }}%.
          data:
            photo:
              - file: "/config/www/snapshots/3d_printer_snapshot_error.jpg"
                caption: "3D print {{ states('sensor.creality_ender_v3_ke_current_print_state') }} — nozzle and bed temperatures"


  - alias: '3D print completed light notification'
    id: 3d_printer_completed_light_notification
    initial_state: true
    trigger:
      - platform: state
        entity_id: sensor.creality_ender_v3_ke_current_print_state
        from: printing
        to: complete

    action:
      - action: light.turn_off
        target:
          entity_id: light.study_ender_led_driver
      - delay:
          seconds: 2

      - repeat:
          count: 10
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.study_ender_led_driver
              data:
                effect: breathe
                brightness_pct: 100

            - delay:
                seconds: 10

      - action: light.turn_off
        target:
          entity_id: light.study_ender_led_driver


  - alias: 'Ask if printer should be shut down after print is done'
    id: 3d_printer_actionable_notification_shutdown_printer_and_turn_lights_off
    initial_state: true
    trigger:
      - platform: state
        entity_id: sensor.creality_ender_v3_ke_current_print_state
        from: printing
        to: complete
        for:
          minutes: 5

    action:
      - action: script.activate_alexa_actionable_notification
        data:
          text: 'The 3D print is done, should I turn off the printer and lights?'
          event_id: 'actionable_notification_study_printing_complete_shutdown'
          alexa_device: 'media_player.study_room'


  - alias: '3D print shutdown printer and turn lights off'
    id: 3d_printer_shutdown_printer_and_turn_lights_off
    trigger:
      - platform: event
        event_type: alexa_actionable_notification
        event_data:
          event_id: actionable_notification_study_printing_complete_shutdown
          event_response_type: ResponseYes

      - platform: event
        event_type: alexa_actionable_notification
        event_data:
          event_id: actionable_notification_study_printing_complete_shutdown
          event_response_type: ResponseNone

    action:
      - action: homeassistant.turn_off
        entity_id:
          - switch.creality_printer
          - switch.shellyplus1pm_e465b8f12024_switch_0
          - light.study_ender_led_driver

  - alias: 'Alert on 3D printer hotend temperature fault'
    id: 3d_print_hotend_temperature_fault_alert
    initial_state: true
    mode: single
    trigger:
      - platform: template
        value_template: >-
          {{ is_state('sensor.creality_ender_v3_ke_current_print_state', 'printing')
             and states('sensor.creality_ender_v3_ke_extruder_temperature') not in ['unknown', 'unavailable', 'none', '']
             and states('number.creality_ender_v3_ke_extruder_target') not in ['unknown', 'unavailable', 'none', '']
             and (states('sensor.creality_ender_v3_ke_extruder_temperature') | float(0)
                  - states('number.creality_ender_v3_ke_extruder_target') | float(0)) | abs > 20 }}
        for:
          seconds: 30
    action:
      - action: camera.snapshot
        data:
          entity_id: camera.creality_ender_v3_ke
          filename: "/config/www/snapshots/3d_printer_snapshot_error.jpg"

      - delay: '00:00:02'

      - action: notify.send_message
        data:
          entity_id: notify.telegram_bot_659000495_155103022
          message: >-
            Hotend temperature fault during a 3D print. The nozzle temperature
            has stayed more than 20°C from target for 30 seconds.
            Current: {{ states('sensor.creality_ender_v3_ke_extruder_temperature') }}°C;
            target: {{ states('number.creality_ender_v3_ke_extruder_target') }}°C.
            Bed: {{ states('sensor.creality_ender_v3_ke_bed_temperature') }}°C;
            target: {{ states('number.creality_ender_v3_ke_bed_target') }}°C.
            Printer message: {{ states('sensor.creality_ender_v3_ke_current_print_message')
              if states('sensor.creality_ender_v3_ke_current_print_message') not in ['', 'unknown', 'unavailable']
              else states('sensor.creality_ender_v3_ke_printer_message') }}.
            Print: {{ states('sensor.creality_ender_v3_ke_filename') }}
            ({{ states('sensor.creality_ender_v3_ke_progress') }}% complete).
          data:
            photo:
              - file: "/config/www/snapshots/3d_printer_snapshot_error.jpg"
                caption: "Hotend temperature fault — nozzle and bed temperatures"


  - alias: '3D Print Init'
    id: 3d_print_init
    initial_state: true
    trigger:
      - platform: state
        entity_id: sensor.creality_ender_v3_ke_current_print_state
        to: 'printing'

    action:
      - action: light.turn_on
        entity_id: light.study_ender_led_driver


  - alias: Study room Toggle light when door opens or closes during 3D print
    id: study_room_toggle_light_when_door_opens_or_closes_during_3d_print
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.study_room_door_contact
        to: 'on'
      - platform: state
        entity_id: binary_sensor.study_room_door_contact
        to: 'off'

    condition:
      - condition: state
        entity_id: sensor.creality_ender_v3_ke_current_print_state
        state: 'printing'

    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.study_room_door_contact
                state: 'on'
            sequence:
              - action: switch.turn_on
                target:
                  entity_id: switch.shellyplus1pm_e465b8f12024_switch_0
          - conditions:
              - condition: state
                entity_id: binary_sensor.study_room_door_contact
                state: 'off'
            sequence:
              - action: switch.turn_off
                target:
                  entity_id: switch.shellyplus1pm_e465b8f12024_switch_0
