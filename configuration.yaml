---
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes
  extra_module_url:
    - /hacsfiles/lovelace-card-mod/card-mod.js

homeassistant:
  packages: !include_dir_named packages/
  auth_mfa_modules:
    - type: totp
  allowlist_external_dirs:
    - /config/www/snapshots

recorder:
  purge_keep_days: 30
  db_url: !secret hass_db_url
  commit_interval: 30
  exclude:
    entity_globs:
      - sensor.*_rssi
      - sensor.*_signal
      - sensor.*_uptime
      - sensor.*_wifi_signal_strength*
      - sensor.*estimated_distance*
      - sensor.*illuminance*
    domains:
      - device_tracker

automation: !include_dir_merge_list automations
input_text: !include input_text.yaml
input_boolean: !include input_boolean.yaml
group: !include group.yaml
notify: !include notification.yaml
scene: !include scenes.yaml
script: !include_dir_merge_named scripts

logger:
  default: info
  logs:
    reolink_aio.api: warning
    surepy.client: warning
    custom_components.ocpp: error
    ocpp: error
    custom_components.moonraker: critical
    moonraker_api.websockets.websocketclient: critical
    homeassistant.components.alexa.state_report: critical
    homeassistant.components.ipp: critical
    homeassistant.components.ring: critical
    homeassistant.components.iss: critical
    homeassistant.components.alexa.capabilities: critical
