AWSTemplateFormatVersion: "2010-09-09"
Description: Python 3.13 AWS Lambda backend for Alexa Actionable Actions.

Parameters:
  PackageBucket:
    Type: String
    Description: Private S3 bucket that contains the Lambda deployment ZIP.
  PackageKey:
    Type: String
    Description: S3 object key for the Lambda deployment ZIP.
  SkillId:
    Type: String
    Default: amzn1.ask.skill.d3fbfb9e-b9aa-454c-8f34-0da94050c526
    Description: Alexa skill ID allowed to invoke this function.
  HomeAssistantUrl:
    Type: String
    Default: https://hass.benita.click
    Description: Home Assistant base URL. Do not include /api.
  MonitorAlarmThreshold:
    Type: Number
    Default: 1
    MinValue: 1
    Description: Number of Lambda errors in one minute that marks the monitor down.
  UptimeRobotIPv4Ranges:
    Type: CommaDelimitedList
    Description: Current UptimeRobot checker IPv4 ranges, fetched by deploy.sh.
  UptimeRobotIPv6Ranges:
    Type: CommaDelimitedList
    Description: Current UptimeRobot checker IPv6 ranges, fetched by deploy.sh.
  UptimeRobotIpListVersion:
    Type: String
    Description: Hash of the UptimeRobot checker IP list fetched by deploy.sh.

Resources:
  AlexaActionsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/alexa-actionable-actions-python313
      RetentionInDays: 14

  AlexaActionsTokenSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: alexa-actionable-actions/home-assistant-token
      Description: Home Assistant long-lived token used by Alexa Actionable Actions.
      SecretString: REPLACE_WITH_NEW_HOME_ASSISTANT_TOKEN

  AlexaActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: alexa-actionable-actions-python313
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WriteOwnCloudWatchLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/alexa-actionable-actions-python313:*"
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref AlexaActionsTokenSecret

  AlexaActionsFunction:
    Type: AWS::Lambda::Function
    DependsOn: AlexaActionsLogGroup
    Properties:
      FunctionName: alexa-actionable-actions-python313
      Description: Alexa Actionable Actions backend, Python 3.13.
      Runtime: python3.13
      Architectures:
        - x86_64
      Handler: lambda_function.lambda_handler
      Role: !GetAtt AlexaActionsRole.Arn
      Code:
        S3Bucket: !Ref PackageBucket
        S3Key: !Ref PackageKey
      MemorySize: 256
      Timeout: 8
      Environment:
        Variables:
          HOME_ASSISTANT_URL: !Ref HomeAssistantUrl
          HOME_ASSISTANT_SECRET_ARN: !Ref AlexaActionsTokenSecret
          VERIFY_SSL: "true"
          ENABLE_COMMANDS: "false"
          DEBUG: "false"
          HTTP_TIMEOUT: "3"

  AlexaActionsInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AlexaActionsFunction
      Principal: alexa-appkit.amazon.com
      EventSourceToken: !Ref SkillId

  AlexaActionsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-AlexaActionsErrors"
      AlarmDescription: Alexa Actionable Actions Lambda errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AlexaActionsFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: !Ref MonitorAlarmThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  AlexaActionsMonitorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadAlarmAndWriteLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/alexa-actionable-actions-monitor:*"
              - Effect: Allow
                Action: cloudwatch:DescribeAlarms
                Resource: !Sub "arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${AWS::StackName}-AlexaActionsErrors"

  AlexaActionsMonitorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/alexa-actionable-actions-monitor
      RetentionInDays: 14

  AlexaActionsMonitor:
    Type: AWS::Lambda::Function
    DependsOn: AlexaActionsMonitorLogGroup
    Properties:
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt AlexaActionsMonitorRole.Arn
      Timeout: 5
      Environment:
        Variables:
          ALARM_NAME: !Ref AlexaActionsAlarm
      Code:
        ZipFile: |
          import json
          import os
          import boto3

          cloudwatch = boto3.client("cloudwatch")

          def handler(event, context):
              result = cloudwatch.describe_alarms(AlarmNames=[os.environ["ALARM_NAME"]])
              alarms = result.get("MetricAlarms", [])
              state = alarms[0]["StateValue"] if alarms else "UNKNOWN"
              return {
                  "statusCode": 200 if state == "OK" else 503,
                  "headers": {"Content-Type": "application/json", "Cache-Control": "no-store"},
                  "body": json.dumps({"status": state}),
              }

  AlexaActionsMonitorApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: Alexa Actionable Actions monitor
      Policy:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: execute-api:Invoke
            Resource: execute-api:/*
            Condition:
              IpAddress:
                aws:SourceIp: !Ref UptimeRobotIPv4Ranges
          - Effect: Allow
            Principal: "*"
            Action: execute-api:Invoke
            Resource: execute-api:/*
            Condition:
              IpAddress:
                aws:SourceIp: !Ref UptimeRobotIPv6Ranges
      EndpointConfiguration:
        Types:
          - REGIONAL

  AlexaActionsMonitorResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AlexaActionsMonitorApi
      ParentId: !GetAtt AlexaActionsMonitorApi.RootResourceId
      PathPart: status

  AlexaActionsMonitorMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AlexaActionsMonitorApi
      ResourceId: !Ref AlexaActionsMonitorResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AlexaActionsMonitor.Arn}/invocations"

  AlexaActionsMonitorDeployerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DeployMonitorApiAndWriteLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/alexa-actionable-actions-monitor-deployer:*"
              - Effect: Allow
                Action: apigateway:POST
                Resource: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/restapis/${AlexaActionsMonitorApi}/deployments"
              - Effect: Allow
                Action: apigateway:DELETE
                Resource: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/restapis/${AlexaActionsMonitorApi}/deployments/*"

  AlexaActionsMonitorDeployerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/alexa-actionable-actions-monitor-deployer
      RetentionInDays: 14

  AlexaActionsMonitorDeployer:
    Type: AWS::Lambda::Function
    DependsOn: AlexaActionsMonitorDeployerLogGroup
    Properties:
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt AlexaActionsMonitorDeployerRole.Arn
      Timeout: 20
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          from botocore.exceptions import ClientError

          apigateway = boto3.client("apigateway")

          def handler(event, context):
              if event["RequestType"] == "Delete":
                  try:
                      apigateway.delete_deployment(
                          restApiId=event["ResourceProperties"]["RestApiId"],
                          deploymentId=event["PhysicalResourceId"],
                      )
                  except ClientError as error:
                      if error.response["Error"]["Code"] not in {"ConflictException", "NotFoundException"}:
                          cfnresponse.send(event, context, cfnresponse.FAILED, {"Error": str(error)})
                          return
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                  return
              try:
                  properties = event["ResourceProperties"]
                  deployment = apigateway.create_deployment(
                      restApiId=properties["RestApiId"],
                      stageName="live",
                      description="UptimeRobot IP list " + properties["IpListVersion"],
                  )
                  cfnresponse.send(
                      event,
                      context,
                      cfnresponse.SUCCESS,
                      {"DeploymentId": deployment["id"]},
                      deployment["id"],
                  )
              except Exception as error:
                  cfnresponse.send(event, context, cfnresponse.FAILED, {"Error": str(error)})

  AlexaActionsMonitorApiDeploymentTrigger:
    Type: Custom::ApiGatewayDeployment
    DependsOn: AlexaActionsMonitorMethod
    Properties:
      ServiceToken: !GetAtt AlexaActionsMonitorDeployer.Arn
      RestApiId: !Ref AlexaActionsMonitorApi
      IpListVersion: !Ref UptimeRobotIpListVersion

  AlexaActionsMonitorInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AlexaActionsMonitor
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${AlexaActionsMonitorApi}/*/GET/status"

Outputs:
  LambdaFunctionArn:
    Description: Set this ARN in Alexa Developer Console > Build > Endpoint.
    Value: !GetAtt AlexaActionsFunction.Arn
  AlexaSkillId:
    Value: !Ref SkillId
  HomeAssistantTokenSecretArn:
    Description: Put a new Home Assistant long-lived token in this secret as plain text.
    Value: !Ref AlexaActionsTokenSecret
  UptimeRobotMonitorUrl:
    Description: Configure an UptimeRobot HTTP monitor for this URL; non-2xx means the CloudWatch alarm is active.
    Value: !Sub "https://${AlexaActionsMonitorApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/live/status"
  UptimeRobotIpListVersion:
    Value: !Ref UptimeRobotIpListVersion
