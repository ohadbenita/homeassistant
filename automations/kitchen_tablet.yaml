---
- alias: Kitchen tablet - clean study
  id: kitchen_tablet_clean_study
  trigger: []
  condition:
    - condition: state
      entity_id: input_boolean.away_mode
      state: 'off'
  action:
    - action: vacuum.send_command
      target:
        entity_id: vacuum.yulanda
      data:
        command: app_segment_clean
        params:
          - segments:
              - 22
            repeat: 2

